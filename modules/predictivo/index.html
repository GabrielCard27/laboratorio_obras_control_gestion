<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis Predictivo — Alumbrado Público RP16</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{
  --bg:#F7F8FA;
  --surface:#FFFFFF;
  --text:#1A2733;
  --text-sec:#5C6B77;
  --border:#E4E8EC;

  --neutral:#2C5F7C;
  --secondary:#8B7FE8;
  --productividad:#16A6A3;
  --atencion:#E2A33D;
  --critico:#D6534A;
  --positivo:#3F9670;

  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;}
h1,h3{margin:0;color:var(--text);}
p{margin:0;}

.page{min-height:100vh;display:flex;flex-direction:column;padding:20px 20px 40px;gap:16px;max-width:1320px;margin:0 auto;}

.modtag{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--neutral);text-transform:uppercase;}
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-top:2px;}
.top h1{font-size:21px;font-weight:700;letter-spacing:-0.01em;}
.top h1 span{color:var(--neutral);}
.top .sub{color:var(--text-sec);font-size:12.5px;margin-top:3px;}
.top .obra{text-align:right;font-size:11px;color:var(--text-sec);}
.top .obra b{display:block;color:var(--text);font-size:13px;font-weight:600;}
.top .obra span{display:block;}

.summary{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
.summary::-webkit-scrollbar{display:none;}
.chip{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:8px 13px;font-size:11.5px;color:var(--text);white-space:nowrap;box-shadow:0 1px 2px rgba(16,24,32,.04);}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none;}
.chip b{font-weight:600;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:760px){ .grid{grid-template-columns:1fr;gap:16px;} }

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;box-shadow:0 1px 2px rgba(16,24,32,.04), 0 2px 10px rgba(16,24,32,.05);display:flex;flex-direction:column;min-width:0;}
.chead{display:flex;align-items:center;gap:11px;}
.badge{flex:none;width:26px;height:26px;border-radius:6px;background:var(--neutral);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11.5px;font-weight:700;}
.ctitle{flex:1;min-width:0;}
.ctitle h3{font-size:16px;font-weight:600;line-height:1.25;}
.ctitle .ctype{font-size:11.5px;color:var(--text-sec);margin-top:2px;}
.statusdot{flex:none;width:9px;height:9px;border-radius:50%;margin-left:6px;}
.statusdot[data-lvl="positivo"]{background:var(--positivo);}
.statusdot[data-lvl="atencion"]{background:var(--atencion);}
.statusdot[data-lvl="critico"]{background:var(--critico);}
.statusdot[data-lvl="neutral"]{background:var(--neutral);}

.panel-controls{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center;}
.panel-controls select{font-size:11px;padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text-sec);font-family:var(--font-ui);}
.panel-controls select:focus{outline:1px solid var(--neutral);}

.chart-wrap{width:100%;margin-top:14px;}
.chart-wrap svg{width:100%;height:100%;display:block;font-variant-numeric:tabular-nums;}

.headline{font-size:13px;color:var(--text);margin-top:14px;font-variant-numeric:tabular-nums;}
.headline b{font-weight:700;}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
@media(max-width:420px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }
.stat{border-top:1px solid var(--border);padding-top:7px;}
.stat .slabel{font-size:10px;color:var(--text-sec);}
.stat .sval{font-family:var(--font-mono);font-size:14.5px;color:var(--text);font-weight:600;margin-top:1px;}

.obs{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
.obs .otag{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--text-sec);text-transform:uppercase;display:block;margin-bottom:4px;}
.obs .oline{font-size:12.5px;line-height:1.55;color:var(--text);}
.obs details{margin-top:9px;}
.obs summary{font-size:11.5px;color:var(--neutral);font-weight:600;cursor:pointer;list-style:none;}
.obs summary::-webkit-details-marker{display:none;}
.obs summary::after{content:" \203A";}
.obs details[open] summary::after{content:" \2304";}
.obs .rec{font-size:12px;line-height:1.55;color:var(--text-sec);margin-top:7px;}

.note{font-size:10.5px;line-height:1.5;color:var(--text-sec);font-style:italic;margin-top:10px;}

.audit-block{margin-top:22px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 22px;}
.audit-block .a-title{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--neutral);text-transform:uppercase;margin-bottom:10px;}
.audit-block ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;}
@media(max-width:640px){ .audit-block ul{grid-template-columns:1fr;} }
.audit-block li{font-size:11.5px;color:var(--text-sec);line-height:1.5;}
.audit-block li.ok::before{content:"✓ ";color:var(--positivo);font-weight:700;}
.audit-block li.na::before{content:"— ";color:var(--text-sec);font-weight:700;}
</style>
</head>
<body>
<div style="background:#16324F;padding:8px 16px;">
  <a href="../../index.html" style="color:#fff;opacity:.85;font:12px -apple-system,sans-serif;text-decoration:none;">&larr; Panel General</a>
</div>
<div id="app" class="page"></div>

<script>
/* =========================================================
   DATA — mismo dataset base que M01/M02/M03: mismos 10 rubros,
   mismos montos y avances mensuales de Alumbrado Público RP16.
   ========================================================= */
const MESES = [
  {id:'2026-01', label:'Ene 26'}, {id:'2026-02', label:'Feb 26'},
  {id:'2026-03', label:'Mar 26'}, {id:'2026-04', label:'Abr 26'},
  {id:'2026-05', label:'May 26'}, {id:'2026-06', label:'Jun 26'},
  {id:'2026-07', label:'Jul 26'}
];

const RUBROS = [
  {id:'columnas',       nombre:'Columnas',                 presupuesto:[0,0,5200,9100,7800,3900,0], costo:[0,0,4576,10010,8970,3510,0], avance:[0,0,20,35,30,15,0]},
  {id:'luminarias',     nombre:'Luminarias LED',           presupuesto:[0,0,0,1700,5100,11900,15300], costo:[0,0,0,2006,4335,34272,13464], avance:[0,0,0,5,15,35,45]},
  {id:'cableado',       nombre:'Cableado',                 presupuesto:[0,0,0,6000,9000,9000,6000], costo:[0,0,0,6900,8100,10620,5100], avance:[0,0,0,20,30,30,20]},
  {id:'tableros',       nombre:'Tableros Eléctricos',      presupuesto:[0,0,0,0,4000,6400,5600], costo:[0,0,0,0,4720,5440,6720], avance:[0,0,0,0,25,40,35]},
  {id:'canalizaciones', nombre:'Canalizaciones',           presupuesto:[0,2800,4900,4200,2100,0,0], costo:[0,2380,5880,3696,2310,0,0], avance:[0,20,35,30,15,0,0]},
  {id:'excavacion',     nombre:'Excavación',               presupuesto:[2800,3200,2000,0,0,0,0], costo:[3220,2880,2360,0,0,0,0], avance:[35,40,25,0,0,0,0]},
  {id:'hormigon',       nombre:'Hormigón',                 presupuesto:[2000,3000,3000,2000,0,0,0], costo:[1800,3540,2550,2400,0,0,0], avance:[20,30,30,20,0,0,0]},
  {id:'manoobra',       nombre:'Mano de Obra',             presupuesto:[1600,2400,3200,3600,3600,3200,2400], costo:[1840,2160,3776,3060,4320,2816,2640], avance:[8,12,16,18,18,16,12]},
  {id:'equipos',        nombre:'Equipos',                  presupuesto:[1200,1800,1200,2400,1800,2400,1200], costo:[900,2430,840,3000,1404,2880,1560], avance:[10,15,10,20,15,20,10]},
  {id:'senalizacion',   nombre:'Señalización y Seguridad', presupuesto:[480,600,600,720,900,1200,1500], costo:[566,510,720,634,990,1380,1350], avance:[8,10,10,12,15,20,25]}
];

RUBROS.forEach(r=>{ r.presupuestoTotal = r.presupuesto.reduce((a,b)=>a+b,0); });

/* =========================================================
   CÁLCULOS EVM — Valor Planificado (PV), Valor Ganado (EV),
   Costo Real (AC), índices CPI/SPI, y proyecciones EAC.
   Todo se deriva de los datos de arriba, mes a mes.
   ========================================================= */
function cumSum(arr){ let acc=0; return arr.map(v=>acc+=v); }

const BAC = RUBROS.reduce((a,r)=>a+r.presupuestoTotal,0); // Budget at Completion
const presMonthly = MESES.map((m,i)=>RUBROS.reduce((a,r)=>a+r.presupuesto[i],0));
const costMonthly = MESES.map((m,i)=>RUBROS.reduce((a,r)=>a+r.costo[i],0));
const PV = cumSum(presMonthly); // Planned Value acumulado
const AC = cumSum(costMonthly); // Actual Cost acumulado

const avanceAcumPct = MESES.map((m,i)=>{
  let num=0;
  RUBROS.forEach(r=>{
    let cum=0; for(let k=0;k<=i;k++) cum+=r.avance[k];
    num += r.presupuestoTotal*cum;
  });
  return num/BAC;
});
const EV = avanceAcumPct.map(a=>BAC*a/100); // Earned Value acumulado
const CPI = EV.map((ev,i)=>ev/AC[i]);
const SPI = EV.map((ev,i)=>ev/PV[i]);

// Dos métodos de proyección EAC, con la información disponible hasta cada mes
const EAC_CPI = CPI.map(cpi=>BAC/cpi);                         // asume que el resto continúa al ritmo de costo observado
const EAC_PLAN = EV.map((ev,i)=>AC[i]+(BAC-ev));                // asume que el resto se ejecuta exactamente según presupuesto

const COSTO_FINAL_REAL = AC[AC.length-1];
const VAC = BAC - COSTO_FINAL_REAL; // Variance at Completion (negativo = sobrecosto)

/* =========================================================
   FORMATO
   ========================================================= */
function fmt(n){ if(n===null||n===undefined||isNaN(n)) return '—';
  return new Intl.NumberFormat('es-AR',{maximumFractionDigits: Math.abs(n)<10? 1:0}).format(n); }
function fmtCompact(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  const sign=n<0?'-':''; const abs=Math.abs(n);
  if(abs>=1000) return sign+(abs/1000).toFixed(1).replace('.',',').replace(',0','')+'k';
  return fmt(n);
}
function fmtPct(n,decimals){ if(n===null||isNaN(n)) return '—'; const d=decimals===undefined?1:decimals;
  return (n>=0?'+':'')+n.toFixed(d)+'%'; }
function fmtSigned(n){ return (n>=0?'+':'')+fmt(n); }

function colorForVar(pct){
  if(pct<0) return 'var(--positivo)';
  if(pct<5) return 'var(--neutral)';
  if(pct<15) return 'var(--atencion)';
  return 'var(--critico)';
}
function levelForVar(pct){
  if(pct<0) return 'positivo';
  if(pct<5) return 'neutral';
  if(pct<15) return 'atencion';
  return 'critico';
}

/* =========================================================
   CHARTS
   ========================================================= */
const CH = {
  lineChart(seriesArr, categories, opts){
    opts=opts||{};
    const W=680,H=320,M={t:20,r:16,b:32,l:52};
    const innerW=W-M.l-M.r, innerH=H-M.t-M.b;
    let allVals=[]; seriesArr.forEach(s=>allVals=allVals.concat(s.values));
    const min=opts.min!==undefined?opts.min:Math.min(0,...allVals);
    const max=opts.max!==undefined?opts.max:Math.max(...allVals,1)*1.06;
    const n=categories.length;
    const xFor=i=> M.l + (n<=1?0:(i/(n-1))*innerW);
    const yFor=v=> M.t+innerH-((v-min)/((max-min)||1))*innerH;
    let grid='';
    for(let t=0;t<=3;t++){ const v=min+(max-min)*t/3; const y=yFor(v);
      grid+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="var(--border)" stroke-dasharray="2,3"/>
             <text x="${M.l-8}" y="${y+4}" font-size="10" text-anchor="end" fill="var(--text-sec)">${opts.pctSuffix?v.toFixed(2):fmtCompact(v)}</text>`; }
    let xlabels=categories.map((c,i)=>`<text x="${xFor(i)}" y="${M.t+innerH+20}" font-size="10.5" text-anchor="middle" fill="var(--text-sec)">${c.replace(' 26','')}</text>`).join('');
    let lines='';
    seriesArr.forEach(s=>{
      const pts=s.values.map((v,i)=>`${xFor(i)},${yFor(v)}`).join(' ');
      lines+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.4" ${s.dashed?'stroke-dasharray="7,5"':''}/>`;
      if(!s.noDots) s.values.forEach((v,i)=> lines+=`<circle cx="${xFor(i)}" cy="${yFor(v)}" r="3" fill="${s.color}"/>`);
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">${grid}${lines}${xlabels}</svg>`;
  },

  bars(categories, values, colorFn, opts){
    opts=opts||{};
    const W=680,H=300,M={t:20,r:16,b:32,l:54};
    const innerW=W-M.l-M.r, innerH=H-M.t-M.b;
    const allV = opts.refLine!==undefined ? values.concat([opts.refLine]) : values;
    const max=Math.max(...allV.map(v=>Math.abs(v)),1)*1.2;
    const min=opts.zeroBase===false?Math.min(...allV)*1.1:Math.min(0,...allV);
    const yFor=v=> M.t+innerH-((v-min)/((max-min)||1))*innerH;
    const n=categories.length, slot=innerW/n, barW=Math.min(slot*0.5,44);
    let bars='', labels='', grid='';
    for(let t=0;t<=3;t++){ const v=min+(max-min)*t/3; const y=yFor(v);
      grid+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="var(--border)" stroke-dasharray="2,3"/>
             <text x="${M.l-8}" y="${y+4}" font-size="10" text-anchor="end" fill="var(--text-sec)">${opts.pctSuffix?fmt(v)+'%':fmtCompact(v)}</text>`; }
    const zeroY = yFor(0);
    if(min<0) grid+=`<line x1="${M.l}" y1="${zeroY}" x2="${W-M.r}" y2="${zeroY}" stroke="var(--text-sec)"/>`;
    if(opts.refLine!==undefined){
      const ry=yFor(opts.refLine);
      grid+=`<line x1="${M.l}" y1="${ry}" x2="${W-M.r}" y2="${ry}" stroke="var(--critico)" stroke-width="1.3" stroke-dasharray="5,3"/>
             <text x="${W-M.r}" y="${ry-6}" font-size="9.5" text-anchor="end" fill="var(--critico)">${opts.refLabel||''}</text>`;
    }
    values.forEach((v,i)=>{
      const x=M.l+i*slot+slot/2-barW/2;
      const y=Math.min(yFor(v),zeroY), h=Math.abs(yFor(v)-zeroY);
      bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(h,1)}" fill="${colorFn(v,i)}" rx="3"/>`;
      labels+=`<text x="${x+barW/2}" y="${M.t+innerH+20}" font-size="10" text-anchor="middle" fill="var(--text-sec)">${categories[i].replace(' 26','')}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">${grid}${bars}${labels}</svg>`;
  },

  groupedBars(categories, series){
    const W=680,H=300,M={t:20,r:16,b:34,l:54};
    const innerW=W-M.l-M.r, innerH=H-M.t-M.b;
    let allVals=[]; series.forEach(s=>allVals=allVals.concat(s.values));
    const max=Math.max(...allVals,1)*1.1;
    const n=categories.length, groupW=innerW/n, barW=Math.min((groupW*0.72)/series.length,40);
    const yFor=v=> M.t+innerH-(v/max)*innerH;
    let bars='', labels='', grid='';
    for(let t=0;t<=3;t++){ const v=max*t/3; const y=yFor(v);
      grid+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="var(--border)" stroke-dasharray="2,3"/>
             <text x="${M.l-8}" y="${y+4}" font-size="10" text-anchor="end" fill="var(--text-sec)">${fmtCompact(v)}</text>`; }
    categories.forEach((c,i)=>{
      const gx = M.l + i*groupW + groupW/2 - (series.length*barW)/2;
      series.forEach((s,si)=>{
        const v=s.values[i], x=gx+si*barW, y=yFor(v);
        bars+=`<rect x="${x}" y="${y}" width="${barW-4}" height="${(M.t+innerH)-y}" fill="${s.color}" rx="3"/>
          <text x="${x+(barW-4)/2}" y="${y-6}" font-size="9.5" font-weight="700" text-anchor="middle" fill="${s.color}">${fmtCompact(v)}</text>`;
      });
      labels+=`<text x="${M.l+i*groupW+groupW/2}" y="${M.t+innerH+20}" font-size="11" text-anchor="middle" fill="var(--text-sec)">${c}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">${grid}${bars}${labels}</svg>`;
  }
};

/* =========================================================
   STATE
   ========================================================= */
const STATE = { p4Mes: 5 }; // índice de mes de corte para comparar métodos (0=Ene..6=Jul); default Jun

/* =========================================================
   PANELES
   ========================================================= */
function buildPanel1(){
  const series=[
    {name:'Valor Planificado (PV)', color:'#8FA7B8', values:PV, dashed:true, noDots:true},
    {name:'Valor Ganado (EV)', color:'var(--productividad)', values:EV},
    {name:'Costo Real (AC)', color:'var(--neutral)', values:AC}
  ];
  return {
    badge:'01', title:'Curva S: Planificado, Ganado y Real', type:'PV · EV · AC acumulados (EVM)',
    status: levelForVar(-VAC/BAC*100),
    chart: CH.lineChart(series, MESES.map(m=>m.label)),
    headline:`<span style="color:#8FA7B8">┄</span> Planificado &nbsp; <span style="color:var(--productividad)">■</span> Ganado &nbsp; <span style="color:var(--neutral)">■</span> Real`,
    obs:`El Valor Planificado (PV) y el Valor Ganado (EV) coinciden en las curvas — el avance físico acompañó al cronograma tal como fue definido (SPI≈1 todo el período). Toda la variación del proyecto es de costo, no de plazo: el Costo Real (AC) se despega recién de forma marcada en junio.`,
    rec:`Cuando PV y EV coinciden así de cerca, conviene concentrar el análisis predictivo en el desempeño de costo (paneles 02 y 03) más que en riesgo de atraso de cronograma.`
  };
}

function buildPanel2(){
  const series=[
    {name:'CPI', color:'var(--neutral)', values:CPI},
    {name:'SPI', color:'var(--secondary)', values:SPI},
    {name:'Referencia (1.0)', color:'#C7CED3', values:MESES.map(()=>1), dashed:true, noDots:true}
  ];
  const minCPI = Math.min(...CPI);
  const minIdx = CPI.indexOf(minCPI);
  return {
    badge:'02', title:'Índices de Desempeño (CPI y SPI)', type:'CPI = EV/AC · SPI = EV/PV',
    status: minCPI<0.9?'critico':(minCPI<0.97?'atencion':'positivo'),
    chart: CH.lineChart(series, MESES.map(m=>m.label), {min:0.75,max:1.1,pctSuffix:true}),
    headline:`CPI mínimo: <b>${minCPI.toFixed(2)}</b> (${MESES[minIdx].label}) &nbsp;·&nbsp; SPI se mantiene ≈1.00 todo el período`,
    obs:`El CPI cae de forma notoria en ${MESES[minIdx].label} (${minCPI.toFixed(2)}) — por cada $1 de costo real incurrido en esa etapa, se generó solo $${minCPI.toFixed(2)} de valor ganado (CPI = EV/AC). El SPI no se mueve del entorno de 1.00: no hay evidencia de atraso de cronograma (SPI = EV/PV, un índice de cronograma, no de costo).`,
    rec:`Un CPI por debajo de 1 sostenido en el tiempo (no solo un mes puntual) es la señal más confiable para activar una revisión de costos — revisar si el mes con CPI más bajo coincide con algún evento puntual en el panel 04 del módulo 03 (diagnóstico de causas).`
  };
}

function buildPanel3(){
  const series=[
    {name:'EAC proyectado (CPI)', color:'var(--critico)', values:EAC_CPI},
    {name:'Presupuesto (BAC)', color:'#8FA7B8', values:MESES.map(()=>BAC), dashed:true, noDots:true},
    {name:'Costo final real', color:'var(--neutral)', values:MESES.map(()=>COSTO_FINAL_REAL), dashed:true, noDots:true}
  ];
  return {
    badge:'03', title:'Evolución del Pronóstico de Costo Final', type:'EAC = BAC / CPI, recalculado cada mes',
    status:'atencion',
    chart: CH.lineChart(series, MESES.map(m=>m.label)),
    headline:`EAC en Jul: <b>${fmt(EAC_CPI[6])} miles $</b> — coincide con el costo final real (el proyecto ya cerró en ese mes).`,
    obs:`Con la información disponible en cada mes, el pronóstico EAC se mantuvo apenas por encima del presupuesto (BAC) hasta mayo — recién en junio, cuando ocurre el salto de costo real, el pronóstico se ajusta bruscamente hacia el valor final.`,
    rec:`Esto es una validación retrospectiva, no una predicción real: el "costo final real" ya se conoce porque el caso está cerrado. El punto de interés es que el método de tendencia (CPI) no pudo anticipar un evento puntual (el salto de precio de Luminarias) antes de que ocurriera — ninguna extrapolación de tendencia lo habría hecho.`
  };
}

function buildPanel4(){
  const i = STATE.p4Mes;
  const categorias = ['BAC (ref.)','EAC · CPI','EAC · Plan','Real (ref.)'];
  const valores = [BAC, EAC_CPI[i], EAC_PLAN[i], COSTO_FINAL_REAL];
  const opts = MESES.map((m,idx)=>`<option value="${idx}" ${idx===i?'selected':''}>${m.label}</option>`).join('');
  return {
    badge:'04', title:'Comparación de Métodos de Proyección', type:`Mes de corte: ${MESES[i].label} — con datos disponibles hasta ese mes`,
    status:'neutral',
    controls:`<select data-p4mes>${opts}</select>`,
    chart: CH.groupedBars(categorias, [{color:'var(--neutral)', values: valores}]),
    headline:`EAC · CPI: <b>${fmt(EAC_CPI[i])}</b> &nbsp;·&nbsp; EAC · Plan: <b>${fmt(EAC_PLAN[i])}</b> &nbsp;·&nbsp; Real (ref.): <b>${fmt(COSTO_FINAL_REAL)}</b> miles $`,
    obs:`Dos métodos de pronóstico, no tres: "EAC · CPI" asume que el resto de la obra se ejecuta al mismo ritmo de costo observado hasta ${MESES[i].label}; "EAC · Plan" asume que lo que falta se ejecuta exactamente según presupuesto, sin arrastrar el desvío pasado. BAC y el costo final real se muestran solo como referencia — el costo final real no es un método de pronóstico, es el resultado conocido contra el que se valida.`,
    rec:`En etapas tempranas, preferir el método más conservador (CPI) para presupuestar contingencia; el método "según plan" sirve como piso optimista, no como pronóstico base.`
  };
}

function buildPanel5(){
  const UMBRAL = 5; // % sobre BAC
  const desvioProy = EAC_CPI.map(v=>(v-BAC)/BAC*100);
  const primerMes = desvioProy.findIndex(v=>v>UMBRAL);
  return {
    badge:'05', title:'Alerta Temprana de Sobrecosto', type:`Desvío proyectado (EAC vs. BAC) — umbral +${UMBRAL}%`,
    status: primerMes>=5 ? 'critico' : 'atencion',
    chart: CH.bars(MESES.map(m=>m.label), desvioProy, v=>colorForVar(v), {refLine:UMBRAL, refLabel:`+${UMBRAL}%`, pctSuffix:true}),
    headline: primerMes>=0
      ? `El pronóstico cruza el umbral de +${UMBRAL}% recién en <b>${MESES[primerMes].label}</b>.`
      : `El pronóstico no llegó a cruzar el umbral de +${UMBRAL}% en ningún mes.`,
    obs: primerMes>=0
      ? `Hasta ${MESES[Math.max(primerMes-1,0)].label} el desvío proyectado se mantuvo por debajo de +${UMBRAL}%, dentro de un rango normal de variación — el método recién señala una alerta relevante en ${MESES[primerMes].label}, el mismo mes en que ocurre el evento que la explica.`
      : `El desvío proyectado se mantuvo controlado durante todo el período.`,
    rec:`Un método basado en tendencia (CPI) solo puede anticipar desvíos que ya se venían gestando — no detecta eventos puntuales (cambios de precio, licitaciones, tipo de cambio) antes de que sucedan. Para esos casos hace falta seguimiento de mercado además del seguimiento de CPI.`
  };
}

function buildPanel6(){
  const errorPct = EAC_CPI.map(v=>(v-COSTO_FINAL_REAL)/COSTO_FINAL_REAL*100);
  const maxAbsErr = Math.max(...errorPct.map(v=>Math.abs(v)).slice(0,6)); // excluye jul (trivialmente 0)
  return {
    badge:'06', title:'Error del Pronóstico', type:'Diferencia entre EAC proyectado y costo final real',
    status:'neutral',
    chart: CH.bars(MESES.map(m=>m.label), errorPct, v=>v<0?'var(--positivo)':'var(--critico)', {zeroBase:false}),
    headline:`Error máximo antes del cierre: <b>${fmt(maxAbsErr)}%</b> &nbsp;·&nbsp; VAC = BAC − Costo Final: <b>${fmtSigned(VAC)} miles $</b> (${fmtPct(VAC/BAC*100)}, negativo = sobrecosto)`,
    obs:`Error % = (EAC proyectado − Costo Final Real) / Costo Final Real × 100. De enero a mayo el error es negativo (entre -9% y -11%): el pronóstico subestimó el costo final, porque todavía no había ocurrido el evento de junio. En junio el error pasa a positivo (+3,5%): el pronóstico sobreestimó levemente. En julio el error es 0%, porque el proyecto ya cerró.`,
    rec:`Este patrón (subestimación sostenida seguida de una corrección abrupta) puede estar asociado a desvíos causados por eventos puntuales más que por tendencias graduales — el panel 04 del módulo 03 (diagnóstico) identificó el efecto precio como dominante, lo cual es coherente con esta lectura, aunque no la confirma por sí sola.`
  };
}

/* =========================================================
   RESUMEN EJECUTIVO
   ========================================================= */
function buildSummary(){
  const minCPI = Math.min(...CPI);
  const minIdx = CPI.indexOf(minCPI);
  return [
    {dot: VAC<0?'critico':'positivo', text:`VAC = BAC − Costo Final: <b>${fmtSigned(VAC)} miles $</b> (negativo = sobrecosto)`},
    {dot: minCPI<0.9?'critico':'atencion', text:`CPI mínimo: <b>${minCPI.toFixed(2)}</b> (${MESES[minIdx].label})`},
    {dot:'neutral', text:`SPI ≈ <b>1.00</b> todo el período — sin atraso de cronograma`}
  ];
}

/* =========================================================
   RENDER
   ========================================================= */
function panelHtml(p){
  const vb = p.chart.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
  const ratio = vb ? `${vb[1]}/${vb[2]}` : '2.1/1';
  return `<div class="card">
    <div class="chead">
      <div class="badge">${p.badge}</div>
      <div class="ctitle"><h3>${p.title}</h3><div class="ctype">${p.type}</div></div>
      <span class="statusdot" data-lvl="${p.status}"></span>
    </div>
    ${p.controls?`<div class="panel-controls">${p.controls}</div>`:''}
    <div class="chart-wrap" style="aspect-ratio:${ratio}">${p.chart}</div>
    ${p.headline?`<div class="headline">${p.headline}</div>`:''}
    <div class="obs">
      <span class="otag">Qué se observa</span>
      <div class="oline">${p.obs}</div>
      <details><summary>Qué debería investigarse</summary><div class="rec">${p.rec}</div></details>
    </div>
  </div>`;
}

function bindControls(){
  const p4=document.querySelector('[data-p4mes]'); if(p4) p4.addEventListener('change',()=>{ STATE.p4Mes=parseInt(p4.value,10); render(); });
}

function render(){
  const panels=[buildPanel1(),buildPanel2(),buildPanel3(),buildPanel4(),buildPanel5(),buildPanel6()];
  const chips = buildSummary();
  const chipsHtml = chips.map(c=>`<div class="chip"><span class="dot" style="background:var(--${c.dot})"></span>${c.text}</div>`).join('');
  document.getElementById('app').innerHTML = `
    <div class="modtag">Módulo 04 · Laboratorio de Control de Gestión de Obras</div>
    <div class="top">
      <div>
        <h1>Análisis <span>Predictivo</span></h1>
        <div class="sub">Proyección de costo final (EAC) a partir del comportamiento observado — validación retrospectiva sobre un caso cerrado</div>
      </div>
      <div class="obra"><b>Alumbrado Público RP16</b><span>Ene – Jul 2026</span><span>BAC ${fmt(BAC)} miles $</span></div>
    </div>
    <div class="summary">${chipsHtml}</div>
    <div class="grid">${panels.map(panelHtml).join('')}</div>
    <div class="audit-block">
      <div class="a-title">Auditoría V1.1</div>
      <ul>
        <li class="ok">Fórmulas verificadas (PV, EV, AC, CPI, SPI, EAC)</li>
        <li class="ok">EAC histórico calculado sin información futura</li>
        <li class="ok">VAC unificado: BAC − Costo Final, misma convención en todo el módulo</li>
        <li class="ok">Error de pronóstico: (EAC − Costo Final Real) / Costo Final Real × 100</li>
        <li class="ok">Alerta temprana: (EAC − BAC) / BAC × 100, umbral +5%</li>
        <li class="ok">CPI / SPI verificados — CPI compara costo real vs. valor ganado; SPI, avance vs. plan</li>
        <li class="ok">Textos revisados (terminología de CPI corregida; el costo real ya no se presenta como método de pronóstico)</li>
        <li class="ok">Diseño preservado: 6 tarjetas, 2×3, misma paleta y tipografía</li>
        <li class="na">ETC no se utiliza como indicador independiente en esta versión — no se incorporó, fuera del alcance solicitado</li>
      </ul>
    </div>
  `;
  bindControls();
}
render();
</script>
</body>
</html>

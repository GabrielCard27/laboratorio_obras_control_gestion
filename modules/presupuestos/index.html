<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presupuestos y Desvíos — Alumbrado Público RP16</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F7F8FA;
  --surface:#FFFFFF;
  --text:#1A2733;
  --text-sec:#5C6B77;
  --border:#E4E8EC;

  --neutral:#2C5F7C;
  --secondary:#8B7FE8;
  --productividad:#16A6A3;
  --atencion:#E2A33D;
  --critico:#D6534A;
  --positivo:#3F9670;

  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;}
h1,h3{margin:0;color:var(--text);}
p{margin:0;}

.page{min-height:100vh;display:flex;flex-direction:column;padding:20px 20px 40px;gap:16px;max-width:1320px;margin:0 auto;}

.modtag{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--neutral);text-transform:uppercase;}
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-top:2px;}
.top h1{font-size:21px;font-weight:700;letter-spacing:-0.01em;}
.top h1 span{color:var(--neutral);}
.top .sub{color:var(--text-sec);font-size:12.5px;margin-top:3px;}
.top .obra{text-align:right;font-size:11px;color:var(--text-sec);}
.top .obra b{display:block;color:var(--text);font-size:13px;font-weight:600;}
.top .obra span{display:block;}

.summary{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
.summary::-webkit-scrollbar{display:none;}
.chip{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:8px 13px;font-size:11.5px;color:var(--text);white-space:nowrap;box-shadow:0 1px 2px rgba(16,24,32,.04);}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none;}
.chip b{font-weight:600;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:760px){ .grid{grid-template-columns:1fr;gap:16px;} }

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;box-shadow:0 1px 2px rgba(16,24,32,.04), 0 2px 10px rgba(16,24,32,.05);display:flex;flex-direction:column;min-width:0;}
.chead{display:flex;align-items:center;gap:11px;}
.badge{flex:none;width:26px;height:26px;border-radius:6px;background:var(--neutral);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11.5px;font-weight:700;}
.ctitle{flex:1;min-width:0;}
.ctitle h3{font-size:16px;font-weight:600;line-height:1.25;}
.ctitle .ctype{font-size:11.5px;color:var(--text-sec);margin-top:2px;}
.statusdot{flex:none;width:9px;height:9px;border-radius:50%;margin-left:6px;}
.statusdot[data-lvl="positivo"]{background:var(--positivo);}
.statusdot[data-lvl="atencion"]{background:var(--atencion);}
.statusdot[data-lvl="critico"]{background:var(--critico);}
.statusdot[data-lvl="neutral"]{background:var(--neutral);}

.panel-controls{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center;}
.panel-controls select{font-size:11px;padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text-sec);font-family:var(--font-ui);}
.panel-controls select:focus{outline:1px solid var(--neutral);}

.chart-wrap{width:100%;margin-top:14px;}
.chart-wrap svg{width:100%;height:100%;display:block;font-variant-numeric:tabular-nums;}

.headline{font-size:13px;color:var(--text);margin-top:14px;font-variant-numeric:tabular-nums;}
.headline b{font-weight:700;}
.headline .up{color:var(--critico);}
.headline .down{color:var(--positivo);}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
@media(max-width:420px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }
.stat{border-top:1px solid var(--border);padding-top:7px;}
.stat .slabel{font-size:10px;color:var(--text-sec);}
.stat .sval{font-family:var(--font-mono);font-size:14.5px;color:var(--text);font-weight:600;margin-top:1px;}

.obs{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
.obs .otag{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--text-sec);text-transform:uppercase;display:block;margin-bottom:4px;}
.obs .oline{font-size:12.5px;line-height:1.55;color:var(--text);}
.obs details{margin-top:9px;}
.obs summary{font-size:11.5px;color:var(--neutral);font-weight:600;cursor:pointer;list-style:none;}
.obs summary::-webkit-details-marker{display:none;}
.obs summary::after{content:" \203A";}
.obs details[open] summary::after{content:" \2304";}
.obs .rec{font-size:12px;line-height:1.55;color:var(--text-sec);margin-top:7px;}

.note{font-size:10.5px;line-height:1.5;color:var(--text-sec);font-style:italic;margin-top:10px;}
</style>
</head>
<body>
<div style="background:#16324F;padding:8px 16px;">
  <a href="../../index.html" style="color:#fff;opacity:.85;font:12px -apple-system,sans-serif;text-decoration:none;">&larr; Panel General</a>
</div>
<div id="app" class="page"></div>

<script>
/* =========================================================
   DATA — mismos montos mensuales de presupuesto/costo/avance
   que el módulo EDA (misma obra, mismo dataset base), más
   cantidades y precios presupuestados/reales para este módulo.
   ========================================================= */
const MESES = [
  {id:'2026-01', label:'Ene 26'}, {id:'2026-02', label:'Feb 26'},
  {id:'2026-03', label:'Mar 26'}, {id:'2026-04', label:'Abr 26'},
  {id:'2026-05', label:'May 26'}, {id:'2026-06', label:'Jun 26'},
  {id:'2026-07', label:'Jul 26'}
];

const RUBROS = [
  {id:'columnas',       nombre:'Columnas',                 corto:'Columnas',   unidad:'u',
    presupuesto:[0,0,5200,9100,7800,3900,0], costo:[0,0,4576,10010,8970,3510,0], avance:[0,0,20,35,30,15,0],
    cantidadReal:179.5, cantidadPresup:170},
  {id:'luminarias',     nombre:'Luminarias LED',           corto:'Luminarias', unidad:'u',
    presupuesto:[0,0,0,1700,5100,11900,15300], costo:[0,0,0,2006,4335,34272,13464], avance:[0,0,0,5,15,35,45],
    cantidadReal:344.2, cantidadPresup:340},
  {id:'cableado',       nombre:'Cableado',                 corto:'Cableado',   unidad:'m',
    presupuesto:[0,0,0,6000,9000,9000,6000], costo:[0,0,0,6900,8100,10620,5100], avance:[0,0,0,20,30,30,20],
    cantidadReal:14944.5, cantidadPresup:14200},
  {id:'tableros',       nombre:'Tableros Eléctricos',      corto:'Tableros',   unidad:'u',
    presupuesto:[0,0,0,0,4000,6400,5600], costo:[0,0,0,0,4720,5440,6720], avance:[0,0,0,0,25,40,35],
    cantidadReal:14.1, cantidadPresup:13},
  {id:'canalizaciones', nombre:'Canalizaciones',           corto:'Canaliz.',   unidad:'m',
    presupuesto:[0,2800,4900,4200,2100,0,0], costo:[0,2380,5880,3696,2310,0,0], avance:[0,20,35,30,15,0,0],
    cantidadReal:5808.7, cantidadPresup:5700},
  {id:'excavacion',     nombre:'Excavación',               corto:'Excavación', unidad:'m³',
    presupuesto:[2800,3200,2000,0,0,0,0], costo:[3220,2880,2360,0,0,0,0], avance:[35,40,25,0,0,0,0],
    cantidadReal:2603.9, cantidadPresup:2550},
  {id:'hormigon',       nombre:'Hormigón',                 corto:'Hormigón',   unidad:'m³',
    presupuesto:[2000,3000,3000,2000,0,0,0], costo:[1800,3540,2550,2400,0,0,0], avance:[20,30,30,20,0,0,0],
    cantidadReal:480.9, cantidadPresup:470},
  {id:'manoobra',       nombre:'Mano de Obra',             corto:'M. Obra',    unidad:'HH',
    presupuesto:[1600,2400,3200,3600,3600,3200,2400], costo:[1840,2160,3776,3060,4320,2816,2640], avance:[8,12,16,18,18,16,12],
    cantidadReal:1917, cantidadPresup:1850},
  {id:'equipos',        nombre:'Equipos',                  corto:'Equipos',    unidad:'h',
    presupuesto:[1200,1800,1200,2400,1800,2400,1200], costo:[900,2430,840,3000,1404,2880,1560], avance:[10,15,10,20,15,20,10],
    cantidadReal:315, cantidadPresup:290},
  {id:'senalizacion',   nombre:'Señalización y Seguridad', corto:'Señaliz.',   unidad:'u',
    presupuesto:[480,600,600,720,900,1200,1500], costo:[566,510,720,634,990,1380,1350], avance:[8,10,10,12,15,20,25],
    cantidadReal:59.8, cantidadPresup:58}
];

/* =========================================================
   CÁLCULOS — todo se deriva de los datos anteriores
   ========================================================= */
RUBROS.forEach(r=>{
  r.presupuestoTotal = r.presupuesto.reduce((a,b)=>a+b,0);
  r.costoTotal = r.costo.reduce((a,b)=>a+b,0);
  r.desvioAbs = r.costoTotal - r.presupuestoTotal;
  r.desvioPct = r.presupuestoTotal>0 ? r.desvioAbs/r.presupuestoTotal*100 : 0;
  r.precioPresup = r.cantidadPresup>0 ? r.presupuestoTotal/r.cantidadPresup : 0;
  r.precioReal = r.cantidadReal>0 ? r.costoTotal/r.cantidadReal : 0;
  r.efectoCantidad = (r.cantidadReal - r.cantidadPresup) * r.precioPresup;
  r.efectoPrecio = (r.precioReal - r.precioPresup) * r.cantidadReal;
});

const TOTAL_PRESUPUESTO = RUBROS.reduce((a,r)=>a+r.presupuestoTotal,0);
const TOTAL_COSTO = RUBROS.reduce((a,r)=>a+r.costoTotal,0);
const TOTAL_DESVIO_ABS = TOTAL_COSTO - TOTAL_PRESUPUESTO;
const TOTAL_DESVIO_PCT = TOTAL_DESVIO_ABS/TOTAL_PRESUPUESTO*100;

function presupuestoMensual(){ return MESES.map((m,i)=> RUBROS.reduce((a,r)=>a+r.presupuesto[i],0)); }
function costoMensual(){ return MESES.map((m,i)=> RUBROS.reduce((a,r)=>a+r.costo[i],0)); }
function avanceMensualPonderado(){
  return MESES.map((m,i)=>{
    let num=0, den=0;
    RUBROS.forEach(r=>{ num+=r.presupuestoTotal*r.avance[i]; den+=r.presupuestoTotal; });
    return den? num/den : 0;
  });
}
function cumulative(arr){ let acc=0; return arr.map(v=>acc+=v); }

/* =========================================================
   FORMATO
   ========================================================= */
function fmt(n){ if(n===null||n===undefined||isNaN(n)) return '—';
  return new Intl.NumberFormat('es-AR',{maximumFractionDigits: Math.abs(n)<10? 1:0}).format(n); }
function fmtCompact(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  const sign=n<0?'-':''; const abs=Math.abs(n);
  if(abs>=1000) return sign+(abs/1000).toFixed(1).replace('.',',').replace(',0','')+'k';
  return fmt(n);
}
function fmtPct(n,decimals){ if(n===null||isNaN(n)) return '—'; const d=decimals===undefined?1:decimals;
  return (n>=0?'+':'')+n.toFixed(d)+'%'; }
function fmtSigned(n){ return (n>=0?'+':'')+fmt(n); }

/* =========================================================
   ANALYTICS mínimos reutilizados
   ========================================================= */
function colorForDesvio(pct){
  if(pct<0) return 'var(--positivo)';
  if(pct<5) return 'var(--neutral)';
  if(pct<15) return 'var(--atencion)';
  return 'var(--critico)';
}
function levelForDesvio(pct){
  if(pct<0) return 'positivo';
  if(pct<5) return 'neutral';
  if(pct<15) return 'atencion';
  return 'critico';
}

/* =========================================================
   CHARTS
   ========================================================= */
const CH = {
  groupedBars(categories, series){
    const W=680,H=320,M={t:16,r:16,b:34,l:52};
    const innerW=W-M.l-M.r, innerH=H-M.t-M.b;
    let allVals=[]; series.forEach(s=>allVals=allVals.concat(s.values));
    const max=Math.max(...allVals,1)*1.08;
    const n=categories.length;
    const groupW=innerW/n;
    const barW=Math.min((groupW*0.7)/series.length, 26);
    const yFor=v=> M.t+innerH-(v/max)*innerH;
    let bars='', labels='', grid='';
    for(let t=0;t<=3;t++){ const v=max*t/3; const y=yFor(v);
      grid+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="var(--border)" stroke-dasharray="2,3"/>
             <text x="${M.l-8}" y="${y+4}" font-size="10" text-anchor="end" fill="var(--text-sec)">${fmtCompact(v)}</text>`; }
    categories.forEach((c,i)=>{
      const gx = M.l + i*groupW + groupW/2 - (series.length*barW)/2;
      series.forEach((s,si)=>{
        const v=s.values[i];
        const x=gx+si*barW;
        const y=yFor(v);
        bars+=`<rect x="${x}" y="${y}" width="${barW-3}" height="${(M.t+innerH)-y}" fill="${s.color}" opacity="0.9" rx="2"/>`;
      });
      labels+=`<text x="${M.l+i*groupW+groupW/2}" y="${M.t+innerH+20}" font-size="10.5" text-anchor="middle" fill="var(--text-sec)">${c.replace(' 26','')}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">${grid}${bars}${labels}</svg>`;
  },

  deltaBars(categories, values, pctMode){
    const W=680,H=300,M={t:20,r:16,b:32,l:54};
    const innerW=W-M.l-M.r, innerH=H-M.t-M.b;
    const maxAbs=Math.max(...values.map(v=>Math.abs(v)),1)*1.15;
    const zeroY = M.t+innerH/2;
    const scale = (innerH/2)/maxAbs;
    const n=categories.length;
    const slot=innerW/n, barW=Math.min(slot*0.55,44);
    let bars='', labels='', grid='';
    grid+=`<line x1="${M.l}" y1="${zeroY}" x2="${W-M.r}" y2="${zeroY}" stroke="var(--text-sec)"/>`;
    [maxAbs*0.5,maxAbs].forEach(v=>{
      grid+=`<text x="${M.l-8}" y="${zeroY-v*scale+4}" font-size="10" text-anchor="end" fill="var(--text-sec)">${pctMode?fmtPct(v,0):fmtCompact(v)}</text>
             <text x="${M.l-8}" y="${zeroY+v*scale+4}" font-size="10" text-anchor="end" fill="var(--text-sec)">${pctMode?fmtPct(-v,0):fmtCompact(-v)}</text>`;
    });
    values.forEach((v,i)=>{
      const x=M.l+i*slot+slot/2-barW/2;
      const h=Math.abs(v)*scale;
      const y = v>=0 ? zeroY-h : zeroY;
      bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(h,1)}" fill="${colorForDesvio(v)}" rx="2"/>`;
      labels+=`<text x="${x+barW/2}" y="${M.t+innerH+18}" font-size="10" text-anchor="middle" fill="var(--text-sec)">${categories[i].replace(' 26','')}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">${grid}${bars}${labels}</svg>`;
  },

  horizontalBars(items, pctMode){
    const rowH=32, W=680, top=10, left=112, right=96;
    const H = top + items.length*rowH + 10;
    const innerW = W-left-right;
    const maxAbs = Math.max(...items.map(it=>Math.abs(it.value)),1)*1.1;
    let bars='';
    items.forEach((it,i)=>{
      const y = top + i*rowH;
      const w = Math.abs(it.value)/maxAbs*innerW;
      const x = left;
      bars+=`<text x="${left-8}" y="${y+rowH/2+4}" font-size="11.5" text-anchor="end" fill="var(--text)">${it.label}</text>
        <rect x="${x}" y="${y+7}" width="${Math.max(w,2)}" height="${rowH-16}" fill="${colorForDesvio(it.pct)}" rx="3"/>
        <text x="${x+w+8}" y="${y+rowH/2+4}" font-size="11.5" font-weight="700" fill="var(--text)">${pctMode?fmtPct(it.value):fmtSigned(it.value)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
  },

  waterfall(steps){
    const W=680,H=340,M={t:24,r:16,b:40,l:56};
    const innerW=W-M.l-M.r, innerH=H-M.t-M.b;
    const maxV=Math.max(...steps.map(s=>Math.max(s.from,s.to)))*1.08;
    const yFor=v=> M.t+innerH-(v/maxV)*innerH;
    const n=steps.length, slot=innerW/n, barW=Math.min(slot*0.5,100);
    let bars='', labels='', grid='';
    for(let t=0;t<=3;t++){ const v=maxV*t/3; const y=yFor(v);
      grid+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="var(--border)" stroke-dasharray="2,3"/>
             <text x="${M.l-8}" y="${y+4}" font-size="10" text-anchor="end" fill="var(--text-sec)">${fmtCompact(v)}</text>`; }
    steps.forEach((s,i)=>{
      const cx = M.l+i*slot+slot/2;
      const y1=yFor(Math.max(s.from,s.to)), y2=yFor(Math.min(s.from,s.to));
      bars+=`<rect x="${cx-barW/2}" y="${y1}" width="${barW}" height="${Math.max(y2-y1,2)}" fill="${s.color}" rx="2"/>`;
      if(i>0 && i<steps.length-1){
        const prevCx = M.l+(i-1)*slot+slot/2;
        bars+=`<line x1="${prevCx+barW/2}" y1="${yFor(s.from)}" x2="${cx-barW/2}" y2="${yFor(s.from)}" stroke="var(--border)" stroke-dasharray="3,3"/>`;
      }
      const labelVal = s.isTotal ? fmt(s.to) : fmtSigned(s.to-s.from);
      bars+=`<text x="${cx}" y="${yFor(Math.max(s.from,s.to))-8}" font-size="11.5" font-weight="700" text-anchor="middle" fill="${s.color}">${labelVal}</text>`;
      labels+=`<text x="${cx}" y="${M.t+innerH+22}" font-size="11" text-anchor="middle" fill="var(--text-sec)">${s.label}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">${grid}${bars}${labels}</svg>`;
  },

  pareto(items){
    const W=680,H=340,M={t:20,r:44,b:64,l:56};
    const innerW=W-M.l-M.r, innerH=H-M.t-M.b;
    const total = items.reduce((a,b)=>a+b.value,0);
    const maxV=Math.max(...items.map(it=>it.value))*1.15;
    const yFor=v=> M.t+innerH-(v/maxV)*innerH;
    const yForPct=p=> M.t+innerH-(p/100)*innerH;
    const n=items.length, slot=innerW/n, barW=Math.min(slot*0.6,48);
    let bars='', labels='', grid='', cum=0, pts=[];
    for(let t=0;t<=3;t++){ const v=maxV*t/3; const y=yFor(v);
      grid+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="var(--border)" stroke-dasharray="2,3"/>
             <text x="${M.l-8}" y="${y+4}" font-size="10" text-anchor="end" fill="var(--text-sec)">${fmtCompact(v)}</text>`; }
    [50,80,100].forEach(p=>{
      const y=yForPct(p);
      grid+=`<text x="${W-M.r+8}" y="${y+4}" font-size="10" text-anchor="start" fill="var(--text-sec)">${p}%</text>`;
      if(p===80) grid+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="var(--atencion)" stroke-width="1.3" stroke-dasharray="4,3"/>`;
    });
    items.forEach((it,i)=>{
      cum+=it.value;
      const cx=M.l+i*slot+slot/2;
      const y=yFor(it.value);
      bars+=`<rect x="${cx-barW/2}" y="${y}" width="${barW}" height="${(M.t+innerH)-y}" fill="var(--neutral)" opacity="0.85" rx="2"/>`;
      labels+=`<text x="${cx}" y="${M.t+innerH+20}" font-size="10.5" text-anchor="middle" fill="var(--text-sec)" transform="rotate(-24 ${cx} ${M.t+innerH+20})">${it.label}</text>`;
      pts.push(`${cx},${yForPct(cum/total*100)}`);
    });
    const line = `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--secondary)" stroke-width="2.4"/>`;
    const dots = items.map((it,i)=>{ const [x,y]=pts[i].split(','); return `<circle cx="${x}" cy="${y}" r="3.6" fill="var(--secondary)"/>`; }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">${grid}${bars}${line}${dots}${labels}</svg>`;
  },

  lineChart(seriesArr, categories){
    const W=680,H=320,M={t:20,r:16,b:32,l:56};
    const innerW=W-M.l-M.r, innerH=H-M.t-M.b;
    let allVals=[]; seriesArr.forEach(s=>allVals=allVals.concat(s.values));
    const min=Math.min(0,...allVals), max=Math.max(...allVals,1)*1.05;
    const n=categories.length;
    const xFor=i=> M.l + (n<=1?0:(i/(n-1))*innerW);
    const yFor=v=> M.t+innerH-((v-min)/((max-min)||1))*innerH;
    let grid='';
    for(let t=0;t<=3;t++){ const v=min+(max-min)*t/3; const y=yFor(v);
      grid+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="var(--border)" stroke-dasharray="2,3"/>
             <text x="${M.l-8}" y="${y+4}" font-size="10" text-anchor="end" fill="var(--text-sec)">${fmtCompact(v)}</text>`; }
    let xlabels=categories.map((c,i)=>`<text x="${xFor(i)}" y="${M.t+innerH+20}" font-size="10.5" text-anchor="middle" fill="var(--text-sec)">${c.replace(' 26','')}</text>`).join('');
    let lines='';
    seriesArr.forEach(s=>{
      const pts=s.values.map((v,i)=>`${xFor(i)},${yFor(v)}`).join(' ');
      lines+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.4" ${s.dashed?'stroke-dasharray="6,4"':''}/>`;
      s.values.forEach((v,i)=> lines+=`<circle cx="${xFor(i)}" cy="${yFor(v)}" r="3" fill="${s.color}"/>`);
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">${grid}${lines}${xlabels}</svg>`;
  }
};

/* =========================================================
   STATE
   ========================================================= */
const STATE = { p1Vista:'acum', p2Ver:'pct', p3Metrica:'pct', p5Rubro:'luminarias' };

/* =========================================================
   PANELES
   ========================================================= */
function buildPanel1(){
  const vista = STATE.p1Vista;
  const presMonthly = presupuestoMensual(), costMonthly = costoMensual();
  const pres = vista==='acum' ? cumulative(presMonthly) : presMonthly;
  const cost = vista==='acum' ? cumulative(costMonthly) : costMonthly;
  const series=[{name:'Presupuesto',color:'#8FA7B8',values:pres},{name:'Costo ejecutado',color:'var(--neutral)',values:cost}];
  return {
    badge:'01', title:'Presupuesto vs. Costo Ejecutado', type: vista==='acum'?'Acumulado mensual':'Monto por período (mensual)',
    status: levelForDesvio(TOTAL_DESVIO_PCT),
    controls:`<select data-p1>
        <option value="acum" ${vista==='acum'?'selected':''}>Vista: Acumulado</option>
        <option value="periodo" ${vista==='periodo'?'selected':''}>Vista: Período</option>
      </select>`,
    chart: CH.groupedBars(MESES.map(m=>m.label), series),
    headline:`<span style="color:#8FA7B8">■</span> Presupuesto &nbsp; <span style="color:var(--neutral)">■</span> Costo ejecutado &nbsp;·&nbsp; Desvío: <b class="${TOTAL_DESVIO_ABS>=0?'up':'down'}">${fmtSigned(TOTAL_DESVIO_ABS)} miles $ (${fmtPct(TOTAL_DESVIO_PCT)})</b>`,
    obs:`El costo ejecutado acumulado de la obra supera al presupuesto en ${fmtPct(TOTAL_DESVIO_PCT)} (${fmtSigned(TOTAL_DESVIO_ABS)} miles $) sobre un presupuesto total de ${fmt(TOTAL_PRESUPUESTO)} miles $.`,
    rec:`El desvío global no está distribuido parejo entre rubros — ver panel 03 (desvío por rubro) y panel 06 (incidencia) para identificar dónde se concentra.`
  };
}

function buildPanel2(){
  const ver = STATE.p2Ver;
  const pres=presupuestoMensual(), cost=costoMensual();
  const desvioAbs = pres.map((p,i)=>cost[i]-p);
  const desvioPct = pres.map((p,i)=> p>0 ? (cost[i]-p)/p*100 : 0);
  const values = ver==='pct' ? desvioPct : desvioAbs;
  const absPct = desvioPct.map(v=>Math.abs(v));
  const maxAbsPct = Math.max(...absPct);
  const maxIdx = absPct.indexOf(maxAbsPct);
  let firstWide = desvioPct.findIndex((v,i)=> i>0 && Math.abs(v)>=10);
  return {
    badge:'02', title:'Evolución del Desvío', type: ver==='pct' ? 'Desvío mensual (%)' : 'Desvío mensual ($, miles)',
    status: levelForDesvio(maxAbsPct),
    controls:`<select data-p2>
        <option value="pct" ${ver==='pct'?'selected':''}>Ver en: %</option>
        <option value="abs" ${ver==='abs'?'selected':''}>Ver en: $</option>
      </select>`,
    chart: CH.deltaBars(MESES.map(m=>m.label), values, ver==='pct'),
    headline:`Mayor desvío mensual: <b>${fmtPct(desvioPct[maxIdx])}</b> (${MESES[maxIdx].label})`,
    obs: firstWide>=0
      ? `A partir de ${MESES[firstWide].label} el desvío mensual supera el 10%, lo que indica un cambio de comportamiento respecto a los meses previos.`
      : `El desvío mensual se mantiene relativamente acotado (menor a 10%) durante todo el período.`,
    rec:`Un desvío puntual en un mes no equivale a un problema sostenido — contrastar con el panel 05 para ver si responde a cantidad, precio o ambos.`
  };
}

function buildPanel3(){
  const metrica = STATE.p3Metrica;
  const items = RUBROS.map(r=>({label:r.corto, full:r.nombre, value: metrica==='pct'?r.desvioPct:r.desvioAbs, pct:r.desvioPct, abs:r.desvioAbs}));
  items.sort((a,b)=>Math.abs(b.value)-Math.abs(a.value));
  const rankAbs = [...RUBROS].sort((a,b)=>Math.abs(b.desvioAbs)-Math.abs(a.desvioAbs)).map(r=>r.id);
  const rankPct = [...RUBROS].sort((a,b)=>Math.abs(b.desvioPct)-Math.abs(a.desvioPct)).map(r=>r.id);
  let diffIdx = rankAbs.findIndex((id,i)=>id!==rankPct[i]);
  const byId = id=>RUBROS.find(r=>r.id===id);
  const obs = diffIdx<0
    ? `El orden por desvío absoluto y por desvío relativo coincide en este período.`
    : `El mayor desvío absoluto no siempre coincide con el mayor desvío relativo: en la posición ${diffIdx+1}, ${byId(rankAbs[diffIdx]).nombre} lidera por monto (${fmtSigned(byId(rankAbs[diffIdx]).desvioAbs)} miles $) mientras que ${byId(rankPct[diffIdx]).nombre} lidera por porcentaje (${fmtPct(byId(rankPct[diffIdx]).desvioPct)}).`;
  return {
    badge:'03', title:'Desvío por Rubro', type: metrica==='pct' ? 'Ordenado por desvío %' : 'Ordenado por desvío $',
    status:'neutral',
    controls:`<select data-p3>
        <option value="pct" ${metrica==='pct'?'selected':''}>Métrica: Desvío %</option>
        <option value="abs" ${metrica==='abs'?'selected':''}>Métrica: Desvío $</option>
      </select>`,
    chart: CH.horizontalBars(items, metrica==='pct'),
    headline:`Mayor desvío: <b>${items[0].full}</b> (${fmtPct(items[0].pct)} · ${fmtSigned(items[0].abs)} miles $)`,
    obs,
    rec:`Un rubro de bajo costo absoluto pero alto desvío relativo puede requerir tanta atención como uno de mayor tamaño — no asumir que "mayor costo" implica "mayor problema".`
  };
}

function buildPanel4(){
  const avanceMens = avanceMensualPonderado();
  const cumAvance = cumulative(avanceMens);
  const costoAcum = cumulative(costoMensual());
  const presupSegunAvance = cumAvance.map(a => TOTAL_PRESUPUESTO*a/100);
  const series=[
    {name:'Presupuesto según avance', color:'#8FA7B8', values:presupSegunAvance, dashed:true},
    {name:'Costo ejecutado', color:'var(--neutral)', values:costoAcum}
  ];
  const finalAvance = cumAvance[cumAvance.length-1];
  const finalPresupAvance = presupSegunAvance[presupSegunAvance.length-1];
  const finalCosto = costoAcum[costoAcum.length-1];
  const desv = finalCosto-finalPresupAvance;
  const desvPct = finalPresupAvance>0 ? desv/finalPresupAvance*100 : 0;
  return {
    badge:'04', title:'Costo Ejecutado vs. Presupuesto según Avance', type:'Evolución mensual — referencia normalizada por avance',
    status: levelForDesvio(desvPct),
    chart: CH.lineChart(series, MESES.map(m=>m.label)),
    stats:[
      {label:'Presupuesto total', val: fmt(TOTAL_PRESUPUESTO)+' miles $'},
      {label:'Avance físico (Jul)', val: fmt(finalAvance)+'%'},
      {label:'Presup. según avance', val: fmt(finalPresupAvance)+' miles $'},
      {label:'Costo ejecutado', val: fmt(finalCosto)+' miles $'},
      {label:'Desvío', val: fmtSigned(desv)+' miles $'},
      {label:'Desvío relativo', val: fmtPct(desvPct)}
    ],
    obs:`Al cierre del período, el costo ejecutado es ${desv>=0?'superior':'inferior'} al presupuesto que correspondería al avance físico alcanzado (${fmtPct(desvPct)}).`,
    rec:`Esta comparación es una referencia económica normalizada por avance, no una medición causal — no implica por sí sola un problema de gestión.`
  };
}

function buildPanel5(){
  const rid = STATE.p5Rubro;
  const r = RUBROS.find(x=>x.id===rid);
  const steps=[
    {label:'Presupuesto', from:0, to:r.presupuestoTotal, color:'#8FA7B8', isTotal:true},
    {label:'Efecto cantidad', from:r.presupuestoTotal, to:r.presupuestoTotal+r.efectoCantidad, color:'var(--productividad)'},
    {label:'Efecto precio', from:r.presupuestoTotal+r.efectoCantidad, to:r.costoTotal, color:'var(--secondary)'},
    {label:'Costo ejecutado', from:0, to:r.costoTotal, color:'var(--neutral)', isTotal:true}
  ];
  const dominante = Math.abs(r.efectoPrecio) > Math.abs(r.efectoCantidad) ? 'precio' : 'cantidad';
  const opts = RUBROS.map(x=>`<option value="${x.id}" ${x.id===rid?'selected':''}>${x.nombre}</option>`).join('');
  return {
    badge:'05', title:'Precio vs. Cantidad', type:`Descomposición del desvío — ${r.nombre}`,
    status: levelForDesvio(r.desvioPct),
    controls:`<select data-p5>${opts}</select>`,
    chart: CH.waterfall(steps),
    stats:[
      {label:'Cantidad presup.', val:fmt(r.cantidadPresup)+' '+r.unidad},
      {label:'Cantidad real', val:fmt(r.cantidadReal)+' '+r.unidad},
      {label:'Precio presup.', val:fmt(r.precioPresup)+' miles $'},
      {label:'Precio real', val:fmt(r.precioReal)+' miles $'},
      {label:'Efecto cantidad', val:fmtSigned(r.efectoCantidad)+' miles $'},
      {label:'Efecto precio', val:fmtSigned(r.efectoPrecio)+' miles $'}
    ],
    obs:`En ${r.nombre}, el desvío de ${fmtSigned(r.desvioAbs)} miles $ (${fmtPct(r.desvioPct)}) está explicado principalmente por el efecto ${dominante} (${fmtSigned(dominante==='precio'?r.efectoPrecio:r.efectoCantidad)} miles $).`,
    rec: dominante==='precio'
      ? `Convendría investigar la evolución de precios/proveedores de este rubro (tipo de cambio, cotizaciones) antes que la cantidad ejecutada.`
      : `Convendría investigar si la mayor cantidad ejecutada responde a un cambio de alcance, mediciones o replanteo — no necesariamente a un sobreprecio.`
  };
}

function buildPanel6(){
  const items = [...RUBROS].filter(r=>r.desvioAbs>0).sort((a,b)=>b.desvioAbs-a.desvioAbs);
  const total = items.reduce((a,r)=>a+r.desvioAbs,0);
  let cum=0, nFor80=items.length;
  for(let i=0;i<items.length;i++){ cum+=items[i].desvioAbs; if(cum/total*100>=80){ nFor80=i+1; break; } }
  const chartItems = items.map(r=>({label:r.corto, value:r.desvioAbs}));
  const pctTop = (items.slice(0,nFor80).reduce((a,r)=>a+r.desvioAbs,0)/total*100);
  return {
    badge:'06', title:'Incidencia del Desvío por Rubro', type:'Pareto — desvío $ y % acumulado',
    status: nFor80<=2 ? 'critico' : 'atencion',
    chart: CH.pareto(chartItems),
    headline:`Los <b>${nFor80}</b> principales rubro${nFor80>1?'s':''} concentra${nFor80>1?'n':''} el <b>${fmt(pctTop)}%</b> del desvío total.`,
    obs:`${items[0].nombre} explica por sí solo el ${fmt(items[0].desvioAbs/total*100)}% del desvío total de la obra (${fmtSigned(items[0].desvioAbs)} miles $).`,
    rec:`Esta concentración señala dónde priorizar el análisis, no una conclusión causal — ver panel 05 para descomponer el desvío de ese rubro en efecto cantidad vs. efecto precio.`
  };
}

/* =========================================================
   RESUMEN EJECUTIVO
   ========================================================= */
function buildSummary(p6){
  const top = [...RUBROS].sort((a,b)=>b.desvioAbs-a.desvioAbs)[0];
  const chips=[];
  chips.push({dot: levelForDesvio(TOTAL_DESVIO_PCT), text:`Desvío total obra: <b>${fmtPct(TOTAL_DESVIO_PCT)}</b>`});
  chips.push({dot: levelForDesvio(top.desvioPct), text:`Mayor desvío: <b>${top.nombre}</b> (${fmtPct(top.desvioPct)})`});
  chips.push({dot: p6.status, text: p6.headline.replace(/<[^>]+>/g,'')});
  return chips;
}

/* =========================================================
   RENDER
   ========================================================= */
function panelHtml(p){
  const vb = p.chart.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
  const ratio = vb ? `${vb[1]}/${vb[2]}` : '2.1/1';
  const statsHtml = p.stats ? `<div class="stat-grid">${p.stats.map(s=>`<div class="stat"><div class="slabel">${s.label}</div><div class="sval">${s.val}</div></div>`).join('')}</div>` : '';
  return `<div class="card">
    <div class="chead">
      <div class="badge">${p.badge}</div>
      <div class="ctitle"><h3>${p.title}</h3><div class="ctype">${p.type}</div></div>
      <span class="statusdot" data-lvl="${p.status}"></span>
    </div>
    ${p.controls?`<div class="panel-controls">${p.controls}</div>`:''}
    <div class="chart-wrap" style="aspect-ratio:${ratio}">${p.chart}</div>
    ${statsHtml}
    ${p.headline?`<div class="headline">${p.headline}</div>`:''}
    <div class="obs">
      <span class="otag">Qué se observa</span>
      <div class="oline">${p.obs}</div>
      <details><summary>Qué debería investigarse</summary><div class="rec">${p.rec}</div></details>
    </div>
  </div>`;
}

function bindControls(){
  const p1=document.querySelector('[data-p1]'); if(p1) p1.addEventListener('change',()=>{ STATE.p1Vista=p1.value; render(); });
  const p2=document.querySelector('[data-p2]'); if(p2) p2.addEventListener('change',()=>{ STATE.p2Ver=p2.value; render(); });
  const p3=document.querySelector('[data-p3]'); if(p3) p3.addEventListener('change',()=>{ STATE.p3Metrica=p3.value; render(); });
  const p5=document.querySelector('[data-p5]'); if(p5) p5.addEventListener('change',()=>{ STATE.p5Rubro=p5.value; render(); });
}

function render(){
  const panels=[buildPanel1(),buildPanel2(),buildPanel3(),buildPanel4(),buildPanel5(),buildPanel6()];
  const chips = buildSummary(panels[5]);
  const chipsHtml = chips.map(c=>`<div class="chip"><span class="dot" style="background:var(--${c.dot})"></span>${c.text}</div>`).join('');
  document.getElementById('app').innerHTML = `
    <div class="modtag">Módulo 02 · Laboratorio de Control de Gestión</div>
    <div class="top">
      <div>
        <h1>Presupuestos y <span>Desvíos</span></h1>
        <div class="sub">¿Dónde se produce el desvío respecto de lo presupuestado y qué lo explica?</div>
      </div>
      <div class="obra"><b>Alumbrado Público RP16</b><span>Ene – Jul 2026</span><span>10 rubros · ${fmt(TOTAL_PRESUPUESTO)} miles $ presupuestados</span></div>
    </div>
    <div class="summary">${chipsHtml}</div>
    <div class="grid">${panels.map(panelHtml).join('')}</div>
  `;
  bindControls();
}
render();
</script>

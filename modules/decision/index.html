<style>
:root{--bg:#edf1f5;--fg:#24313a;--card:rgba(255,255,255,.82);--primary:#235665;--on-primary:#fff;--muted:#687782;--line:#d1d9e0;--danger:#c54736;--warning:#b97916;--success:#2f8a69;--soft:#e4e9ed;--shadow:0 10px 35px rgba(24,42,56,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Arial,sans-serif;letter-spacing:0}.dashboard{min-height:100vh;background:linear-gradient(180deg,#e7eef1 0,var(--bg) 25rem)}.shell{width:min(1180px,calc(100% - 32px));margin-inline:auto}.dashboard-header{border-bottom:1px solid var(--line);background:rgba(255,255,255,.7);backdrop-filter:blur(18px)}.header-inner{padding-block:22px;position:relative}.header-kicker{display:flex;align-items:center;gap:9px;color:var(--primary);font-size:11px;font-weight:700;text-transform:uppercase}.brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--primary);color:var(--on-primary);font-family:Consolas,monospace}.project-meta{position:absolute;right:0;top:22px;text-align:right;font-size:11px;color:var(--muted)}.project-meta b,.project-meta span{display:block}.project-meta b{font-size:13px;color:var(--fg)}h1{margin:18px 0 3px;font-size:clamp(25px,4vw,38px);line-height:1.08;font-weight:650}.header-inner>p{margin:0;color:var(--muted);font-size:14px}.content{padding-block:18px 42px}.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpi,.glass{background:var(--card);border:1px solid rgba(209,217,224,.85);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.kpi{padding:16px;border-radius:8px;display:flex;flex-direction:column;min-width:0}.kpi>span{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted)}.kpi strong{margin-top:7px;font:600 24px/1 Consolas,monospace;color:var(--primary)}.kpi small{margin-top:6px;color:var(--muted);font-size:11px}.danger{color:var(--danger)!important}.warning{color:var(--warning)!important}.matrix-section{margin-top:16px;padding:20px;border-radius:8px}.section-heading{display:flex;justify-content:space-between;gap:14px;align-items:start}.section-heading h2,.recommendation-head h2{margin:3px 0 0;font-size:20px;line-height:1.2}.section-heading p{margin:4px 0 0;font-size:12px;color:var(--muted)}.section-no,.recommendation-head>span{font:600 10px Consolas,monospace;color:var(--primary)}.count{font:500 10px Consolas,monospace;color:var(--muted);white-space:nowrap}.matrix-layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:22px;margin-top:18px}.plot-scroll{min-width:0}.matrix{display:block;width:100%;height:auto;min-height:360px}.matrix .plot-bg{fill:rgba(237,241,245,.7);stroke:var(--line)}.matrix .risk-zone{fill:rgba(197,71,54,.08)}.matrix .safe-zone{fill:rgba(47,138,105,.08)}.matrix .grid-line{stroke:var(--line);stroke-width:1}.matrix .axis-tick{font:10px Consolas,monospace;fill:var(--muted)}.matrix .axis-title{font:600 10px Consolas,monospace;fill:var(--muted);text-transform:uppercase}.point circle{stroke:#fff;stroke-width:3}.point text{font:700 9px Consolas,monospace;fill:#fff}.point-critical circle,.legend-index.critical{fill:var(--danger)}.point-warning circle,.legend-index.warning{fill:var(--warning)}.point-normal circle,.legend-index.normal{fill:var(--primary)}.matrix-legend{list-style:none;margin:0;padding:4px 0 4px 20px;border-left:1px solid var(--line);display:grid;grid-template-columns:1fr;align-content:center;gap:9px}.matrix-legend li{display:flex;align-items:center;gap:9px;min-width:0}.legend-index{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;color:#fff;font:600 9px Consolas,monospace;flex:none}.matrix-legend b,.matrix-legend small{display:block}.matrix-legend b{font-size:11px}.matrix-legend small{font:9px Consolas,monospace;color:var(--muted);margin-top:2px}.matrix-note{display:flex;gap:12px;border-top:1px solid var(--line);padding-top:13px;margin-top:10px;font-size:11px}.matrix-note b{color:var(--primary);white-space:nowrap}.matrix-note span{color:var(--muted)}.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel{border-radius:8px;padding:20px;display:flex;flex-direction:column}.panel-head{display:flex;gap:11px;align-items:start}.panel-no{width:29px;height:29px;border-radius:6px;display:grid;place-items:center;background:var(--primary);color:#fff;font:600 10px Consolas,monospace;flex:none}.panel h3{margin:0;font-size:15px}.panel-head p{margin:2px 0 0;font-size:10px;color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:18px}.stats div{border-top:1px solid var(--line);padding-top:8px}.stats span,.stats b{display:block}.stats span{font-size:9px;color:var(--muted)}.stats b{font:600 14px Consolas,monospace;margin-top:3px}.observation{margin-top:auto;padding-top:16px}.observation>span{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted)}.observation>p,.observation details p{font-size:11px;line-height:1.55;margin:4px 0 0}.observation details{border-top:1px solid var(--line);margin-top:12px;padding-top:9px}.observation summary{cursor:pointer;color:var(--primary);font-size:10px;font-weight:600}.observation details p{color:var(--muted)}.comparison{margin-top:18px;display:grid;gap:12px}.comparison div{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:10px}.comparison b{font-family:Consolas,monospace}.comparison i{grid-column:1/-1;height:7px;background:var(--danger);border-radius:3px}.comparison i.contained{background:var(--success)}.headline{margin:13px 0 0;font-size:11px}.bars{margin-top:18px;display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:78px 1fr 54px;gap:8px;align-items:center;font-size:9px}.bar-row>i{height:7px;border-radius:3px;background:var(--soft)}.bar-row em{display:block;height:100%;border-radius:3px;background:var(--primary)}.bar-row b{font:600 9px Consolas,monospace;text-align:right}.recommendations{margin-top:16px;padding:22px;border-radius:8px;background:var(--primary);color:#fff}.recommendation-head>span{color:rgba(255,255,255,.65)}.recommendations ol{list-style:none;padding:0;margin:18px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.17)}.recommendations li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:14px;background:var(--primary);align-items:start}.recommendations li>span{font:500 10px Consolas,monospace;opacity:.55}.recommendations li b{font-size:12px}.recommendations li p{margin:3px 0 0;font-size:10px;opacity:.7}.recommendations li strong{font:600 11px Consolas,monospace}
@media(max-width:760px){.shell{width:min(100% - 24px,620px)}.header-inner{padding-block:16px}.project-meta{position:static;text-align:left;margin-top:15px;padding-top:11px;border-top:1px solid var(--line)}h1{margin-top:15px;font-size:27px}.kpi-grid{gap:7px}.kpi{padding:11px 9px}.kpi strong{font-size:18px}.kpi small{font-size:9px}.matrix-section{padding:14px}.matrix-layout{display:block}.plot-scroll{overflow-x:auto;margin-inline:-8px;padding-inline:8px}.matrix{width:700px;min-height:0}.matrix-legend{border-left:0;border-top:1px solid var(--line);padding:14px 0 0;margin-top:8px;grid-template-columns:1fr 1fr;gap:10px}.matrix-note{display:block}.matrix-note b,.matrix-note span{display:block}.matrix-note span{margin-top:4px}.analysis-grid{grid-template-columns:1fr}.recommendations{padding:18px}.recommendations ol{grid-template-columns:1fr}.section-heading p{display:none}}
@media print{body{background:#fff}.dashboard{background:#fff}.glass,.kpi{box-shadow:none;backdrop-filter:none}.analysis-grid{break-inside:avoid}.matrix-section,.recommendations{break-inside:avoid}}
</style>
</head>
<body><div id="app"></div>
<script>
const MESES=["Ene 26","Feb 26","Mar 26","Abr 26","May 26","Jun 26","Jul 26"];
const RUBROS=[
{id:"columnas",nombre:"Columnas",corto:"Columnas",presupuesto:[0,0,5200,9100,7800,3900,0],costo:[0,0,4576,10010,8970,3510,0],avance:[0,0,20,35,30,15,0],horas:[0,0,177,481,339,187,0],cantidadReal:179.5,cantidadPresup:170},
{id:"luminarias",nombre:"Luminarias LED",corto:"Luminarias",presupuesto:[0,0,0,1700,5100,11900,15300],costo:[0,0,0,2006,4335,34272,13464],avance:[0,0,0,5,15,35,45],horas:[0,0,0,47,213,339,390],cantidadReal:344.2,cantidadPresup:340,consumoMensual:[0,0,0,17.2,52.5,115.4,159.1]},
{id:"cableado",nombre:"Cableado",corto:"Cableado",presupuesto:[0,0,0,6000,9000,9000,6000],costo:[0,0,0,6900,8100,10620,5100],avance:[0,0,0,20,30,30,20],horas:[0,0,0,241,484,274,269],cantidadReal:14944.5,cantidadPresup:14200},
{id:"tableros",nombre:"Tableros Eléctricos",corto:"Tableros",presupuesto:[0,0,0,0,4000,6400,5600],costo:[0,0,0,0,4720,5440,6720],avance:[0,0,0,0,25,40,35],horas:[0,0,0,0,159,317,223],cantidadReal:14.1,cantidadPresup:13},
{id:"canalizaciones",nombre:"Canalizaciones",corto:"Canaliz.",presupuesto:[0,2800,4900,4200,2100,0,0],costo:[0,2380,5880,3696,2310,0,0],avance:[0,20,35,30,15,0,0],horas:[0,149,209,185,128,0,0],cantidadReal:5808.7,cantidadPresup:5700},
{id:"excavacion",nombre:"Excavación",corto:"Excavación",presupuesto:[2800,3200,2000,0,0,0,0],costo:[3220,2880,2360,0,0,0,0],avance:[35,40,25,0,0,0,0],horas:[142,211,88,0,0,0,0],cantidadReal:2603.9,cantidadPresup:2550},
{id:"hormigon",nombre:"Hormigón",corto:"Hormigón",presupuesto:[2000,3000,3000,2000,0,0,0],costo:[1800,3540,2550,2400,0,0,0],avance:[20,30,30,20,0,0,0],horas:[120,120,177,109,0,0,0],cantidadReal:480.9,cantidadPresup:470},
{id:"manoobra",nombre:"Mano de Obra",corto:"M. Obra",presupuesto:[1600,2400,3200,3600,3600,3200,2400],costo:[1840,2160,3776,3060,4320,2816,2640],avance:[8,12,16,18,18,16,12],horas:[132,259,230,440,363,245,248],cantidadReal:1917,cantidadPresup:1850},
{id:"equipos",nombre:"Equipos",corto:"Equipos",presupuesto:[1200,1800,1200,2400,1800,2400,1200],costo:[900,2430,840,3000,1404,2880,1560],avance:[10,15,10,20,15,20,10],horas:[36,36,35,66,45,69,28],cantidadReal:315,cantidadPresup:290},
{id:"senalizacion",nombre:"Señalización y Seguridad",corto:"Señaliz.",presupuesto:[480,600,600,720,900,1200,1500],costo:[566,510,720,634,990,1380,1350],avance:[8,10,10,12,15,20,25],horas:[19,35,29,35,61,55,90],cantidadReal:59.8,cantidadPresup:58}
];
const sum=a=>a.reduce((x,y)=>x+y,0),mean=a=>sum(a)/a.length;
const pearson=(x,y)=>{if(x.length<3)return 0;const mx=mean(x),my=mean(y);let n=0,dx=0,dy=0;x.forEach((v,i)=>{n+=(v-mx)*(y[i]-my);dx+=(v-mx)**2;dy+=(y[i]-my)**2});return dx&&dy?n/Math.sqrt(dx*dy):0};
const data=RUBROS.map(r=>{const presupuestoTotal=sum(r.presupuesto),costoTotal=sum(r.costo),active=r.costo.map((v,i)=>v>0?i:-1).filter(i=>i>=0),precioPresup=presupuestoTotal/r.cantidadPresup,precioReal=costoTotal/r.cantidadReal;return {...r,presupuestoTotal,costoTotal,desvioAbs:costoTotal-presupuestoTotal,desvioPct:(costoTotal-presupuestoTotal)/presupuestoTotal*100,efectoPrecio:(precioReal-precioPresup)*r.cantidadReal,efectoCantidad:(r.cantidadReal-r.cantidadPresup)*precioPresup,consistencia:pearson(active.map(i=>r.avance[i]),active.map(i=>r.horas[i]))}});
const BAC=sum(data.map(r=>r.presupuestoTotal)),TOTAL=sum(data.map(r=>r.costoTotal)),DESVIO=(TOTAL-BAC)/BAC*100;
const monthlyCost=MESES.map((_,i)=>sum(RUBROS.map(r=>r.costo[i]||0)));let acc=0;const AC=monthlyCost.map(v=>acc+=v);const EV=MESES.map((_,i)=>data.reduce((t,r)=>t+r.presupuestoTotal*sum(r.avance.slice(0,i+1)),0)/100);const CPI=EV.map((v,i)=>v/AC[i]);
const lum=data.find(r=>r.id==="luminarias"),consumo=lum.consumoMensual,precioNormal=(lum.costo[3]+lum.costo[4]+lum.costo[6])/(consumo[3]+consumo[4]+consumo[6]),ahorroLum=lum.costo[5]-consumo[5]*precioNormal,costoContra=TOTAL-ahorroLum,desvioContra=(costoContra-BAC)/BAC*100,costoMayo=BAC/CPI[4],ahorroMayo=TOTAL-costoMayo;
const efectoPrecioPos=data.filter(r=>r.efectoPrecio>0).sort((a,b)=>b.efectoPrecio-a.efectoPrecio).slice(0,6),fmt=n=>new Intl.NumberFormat("es-AR",{maximumFractionDigits:Math.abs(n)<10?1:0}).format(n),pct=n=>`${n>=0?"+":""}${n.toFixed(1)}%`,level=r=>r.consistencia<.15&&Math.abs(r.desvioAbs)>2500?"critical":Math.abs(r.desvioAbs)>5000?"warning":"normal";
const max=Math.max(...data.map(r=>Math.abs(r.desvioAbs)),1)*1.12,minC=Math.max(-1,Math.min(...data.map(r=>r.consistencia))-.12),maxC=Math.min(1,Math.max(...data.map(r=>r.consistencia))+.06),yPos=v=>354-((v-minC)/(maxC-minC))*330;
const ticksX=[0,.25,.5,.75,1].map(v=>`<g><line x1="${70+v*710}" x2="${70+v*710}" y1="24" y2="354" class="grid-line"/><text x="${70+v*710}" y="379" text-anchor="middle" class="axis-tick">${fmt(v*v*max)}</text></g>`).join("");
const ticksY=[0,.25,.5,.75,1].map(s=>{const v=minC+s*(maxC-minC),y=yPos(v);return `<g><line x1="70" x2="780" y1="${y}" y2="${y}" class="grid-line"/><text x="56" y="${y+4}" text-anchor="end" class="axis-tick">${v.toFixed(2)}</text></g>`}).join("");
const points=data.map((r,i)=>{const x=70+Math.sqrt(Math.abs(r.desvioAbs)/max)*710,y=yPos(r.consistencia);return `<g class="point point-${level(r)}"><title>${r.nombre}: desvío ${fmt(r.desvioAbs)} · r ${r.consistencia.toFixed(2)}</title><circle cx="${x}" cy="${y}" r="13"/><text x="${x}" y="${y+4}" text-anchor="middle">${i+1}</text></g>`}).join("");
const legend=data.map((r,i)=>`<li><span class="legend-index ${level(r)}">${i+1}</span><span><b>${r.nombre}</b><small>${fmt(r.desvioAbs)}k · r ${r.consistencia.toFixed(2)}</small></span></li>`).join("");
const stats=items=>`<div class="stats">${items.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join("")}</div>`;
const panel=(no,title,subtitle,body,obs,invest)=>`<article class="glass panel"><div class="panel-head"><span class="panel-no">${no}</span><div><h3>${title}</h3><p>${subtitle}</p></div></div>${body}<div class="observation"><span>Qué se observa</span><p>${obs}</p><details><summary>Qué debería investigarse</summary><p>${invest}</p></details></div></article>`;
const maxBar=Math.max(...efectoPrecioPos.map(r=>r.efectoPrecio)),bars=`<div class="bars">${efectoPrecioPos.map(r=>`<div class="bar-row"><span>${r.corto}</span><i><em style="width:${Math.max(3,r.efectoPrecio/maxBar*100)}%"></em></i><b>+${fmt(r.efectoPrecio)}k</b></div>`).join("")}</div>`;
document.getElementById("app").innerHTML=`<div class="dashboard"><header class="dashboard-header"><div class="shell header-inner"><div class="header-kicker"><span class="brand-mark">05</span><span>Módulo 05 · Control de gestión</span></div><div class="project-meta"><b>Alumbrado Público RP16</b><span>Ene – Jul 2026 · BAC ${fmt(BAC)} miles $</span></div><h1>Decisión y análisis de escenarios</h1><p>Alternativas cuantificadas para orientar la revisión de costos y desempeño.</p></div></header><main class="shell content"><section class="kpi-grid" aria-label="Resumen ejecutivo"><article class="kpi"><span>Desvío real</span><strong class="danger">${pct(DESVIO)}</strong><small>${fmt(TOTAL-BAC)} miles $ sobre BAC</small></article><article class="kpi"><span>Ahorro potencial</span><strong>${fmt(ahorroLum)}k</strong><small>escenario precio luminarias</small></article><article class="kpi"><span>Alerta temprana</span><strong class="warning">Jun 26</strong><small>CPI final ${CPI[6].toFixed(2)}</small></article></section>
<section class="glass matrix-section"><div class="section-heading"><div><span class="section-no">03 · PRIORIZACIÓN</span><h2>Matriz de desvío vs. consistencia</h2><p>Separación visual por cuadrantes; cada número corresponde a un rubro.</p></div><span class="count">10 rubros</span></div><div class="matrix-layout"><div class="plot-scroll"><svg class="matrix" viewBox="0 0 820 430" role="img" aria-label="Matriz de priorización de rubros"><rect x="70" y="24" width="710" height="330" rx="8" class="plot-bg"/><rect x="425" y="24" width="355" height="165" class="risk-zone"/><rect x="70" y="189" width="355" height="165" class="safe-zone"/>${ticksX}${ticksY}<text x="425" y="416" text-anchor="middle" class="axis-title">Desvío absoluto · miles $ →</text><text x="17" y="190" text-anchor="middle" transform="rotate(-90 17 190)" class="axis-title">Consistencia avance–horas (r)</text>${points}</svg></div><ol class="matrix-legend">${legend}</ol></div><div class="matrix-note"><b>Lectura prioritaria</b><span>Los rubros más a la derecha tienen mayor impacto económico; los más abajo muestran menor consistencia entre avance y horas.</span></div></section>
<section class="analysis-grid">${panel("01","Tablero de decisión","Síntesis de los módulos 01 a 04",stats([["Rubro crítico","Luminarias LED"],["Efecto dominante","Precio"],["VAC final",`${fmt(BAC-TOTAL)}k`],["CPI final",CPI[6].toFixed(2)]]),"El sobrecosto se concentra principalmente en precio y la alerta más relevante se activa en junio.","Usar los escenarios siguientes para separar el evento puntual de luminarias del deterioro general de desempeño.")}${panel("02","Precio de luminarias sin pico","Misma cantidad instalada, precio normal",`<div class="comparison"><div><span>Costo real</span><b>${fmt(TOTAL)}k</b><i></i></div><div><span>Precio contenido</span><b>${fmt(costoContra)}k</b><i class="contained" style="width:${costoContra/TOTAL*100}%"></i></div></div><p class="headline">Ahorro potencial <b>${fmt(ahorroLum)} miles $</b></p>`,`El desvío total caería de ${pct(DESVIO)} a ${pct(desvioContra)} al sustituir únicamente el precio atípico de junio.`,"Confirmar si el salto respondió a proveedor, tipo de cambio o condiciones de licitación.")}${panel("04","Sostener el ritmo de mayo","EAC recalculado con CPI de mayo",stats([["CPI mayo",CPI[4].toFixed(2)],["CPI junio",CPI[5].toFixed(2)],["Costo proyectado",`${fmt(costoMayo)}k`],["Diferencia",`+${fmt(ahorroMayo)}k`]]),`Mantener el ritmo de mayo habría proyectado un costo final de ${fmt(costoMayo)} miles $.`,"Este escenario dimensiona el costo del deterioro mensual; no estima por sí solo cuánto era evitable.")}${panel("05","Candidatos a revisión de precios","Efecto precio positivo, de mayor a menor",bars,"Los primeros rubros concentran la mayor parte del efecto precio positivo de la obra.","Revisar redeterminaciones donde el desvío se explique por precio; para cantidad, revisar alcance y mediciones.")}</section>
<section class="recommendations"><div class="recommendation-head"><span>06 · ACCIONES</span><h2>Recomendaciones priorizadas</h2></div><ol><li><span>01</span><div><b>Revisar el precio de Luminarias LED de junio</b><p>Es el factor individual de mayor impacto de la obra.</p></div><strong>${fmt(ahorroLum)}k</strong></li><li><span>02</span><div><b>Bajar el umbral de alerta de CPI</b><p>Habría señalado antes el deterioro de costo.</p></div><strong>${fmt(ahorroMayo)}k</strong></li><li><span>03</span><div><b>Investigar el consumo de cable de mayo</b><p>Confirmar si responde a recableado o pérdidas.</p></div><strong>—</strong></li><li><span>04</span><div><b>Monitorear baja consistencia avance–horas</b><p>Priorizar seguimiento de productividad, no solo de costo.</p></div><strong>—</strong></li></ol></section></main></div>`;
</script>
</body></html>

html,body{min-height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;}

.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;padding:4px 2px 2px;}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:stretch;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 22px 18px;display:flex;flex-direction:column;min-height:0;min-width:0;box-shadow:0 3px 14px rgba(22,50,79,.055);transition:box-shadow .2s ease,border-color .2s ease,transform .2s ease}.card:hover{border-color:#BFCBD4;box-shadow:0 7px 22px rgba(22,50,79,.09);transform:translateY(-1px)}
.card .chead{display:flex;align-items:center;gap:11px;}

// aplanar a registros
const RECORDS = [];

const VARIABLES = [
  {id:'costo', label:'Costo', unidad:'miles $', color:'var(--costos)'},
  {id:'presupuesto', label:'Presupuesto Ejecutado', unidad:'miles $', color:'#3E6E8E'},
  {id:'avance', label:'Avance Físico', unidad:'%', color:'var(--trend)'},
  {id:'certificacion', label:'Certificación', unidad:'miles $', color:'var(--favorable)'},
  {id:'horas', label:'Horas Hombre', unidad:'HH', color:'var(--productividad)'},

  {id:'precioUnitario', label:'Precio Unitario', unidad:'miles $ / unidad', color:'var(--atencion)'},
  {id:'desvio', label:'Desvío %', unidad:'% vs. presupuesto', color:'var(--critico)'}
];
function varDef(id){ return VARIABLES.find(v=>v.id===id); }
function getValue(rec, varId){
  if(varId==='precioUnitario') return rec.consumo>0 ? rec.costo/rec.consumo : null;
  if(varId==='desvio') return rec.presupuesto>0 ? (rec.costo-rec.presupuesto)/rec.presupuesto*100 : null;
  return rec[varId];
}
function activeVal(v, varId){ return varId==='desvio' ? (v!==null && !isNaN(v)) : (v!==null && v>0); }

/* =========================================================
   ANALYTICS
   ========================================================= */
const A = {
  mean(arr){ if(!arr.length) return 0; return arr.reduce((a,b)=>a+b,0)/arr.length; },
  median(arr){ if(!arr.length) return 0; const s=[...arr].sort((a,b)=>a-b); const m=Math.floor(s.length/2);
    return s.length%2 ? s[m] : (s[m-1]+s[m])/2; },
  std(arr){ if(arr.length<2) return 0; const m=A.mean(arr); const v=arr.reduce((a,b)=>a+(b-m)**2,0)/(arr.length-1);
    return Math.sqrt(v); },
  quartiles(arr){
    const s=[...arr].sort((a,b)=>a-b); const n=s.length; if(!n) return {q1:0,q2:0,q3:0,iqr:0,min:0,max:0,low:0,high:0};
    const q=(p)=>{ const idx=(n-1)*p; const lo=Math.floor(idx), hi=Math.ceil(idx); if(lo===hi) return s[lo];
      return s[lo]+(s[hi]-s[lo])*(idx-lo); };
    const q1=q(0.25), q2=q(0.5), q3=q(0.75), iqr=q3-q1;
    return {q1,q2,q3,iqr,min:s[0],max:s[n-1],low:q1-1.5*iqr, high:q3+1.5*iqr};
  },
  outliers(arr){
    const {low,high,iqr} = A.quartiles(arr);
    return arr.map((v,i)=>({i, v, flag: v<low||v>high, extreme: iqr>0 && (v < low-1.5*iqr || v > high+1.5*iqr)}));
  },
  pearson(x,y){
    const n=x.length; if(n<3) return 0;
    const mx=A.mean(x), my=A.mean(y);
    let num=0,dx=0,dy=0;
    for(let i=0;i<n;i++){ num+=(x[i]-mx)*(y[i]-my); dx+=(x[i]-mx)**2; dy+=(y[i]-my)**2; }
    if(dx===0||dy===0) return 0;
    return num/Math.sqrt(dx*dy);
  },
  regression(x,y){
    const n=x.length; const mx=A.mean(x), my=A.mean(y);
    let num=0, den=0;
    for(let i=0;i<n;i++){ num+=(x[i]-mx)*(y[i]-my); den+=(x[i]-mx)**2; }
    const slope = den===0?0:num/den;
    const intercept = my - slope*mx;
    return {slope, intercept, r:A.pearson(x,y)};
  },
  corrStrengthLabel(r){
    const a=Math.abs(r);
    if(a<0.3) return 'relación lineal débil';
    if(a<0.6) return 'relación lineal moderada';
    return 'relación lineal fuerte';
  }
};

/* =========================================================
   CHARTS
   ========================================================= */
function fmt(n){ if(n===null||n===undefined||isNaN(n)) return '—';
  return new Intl.NumberFormat('es-AR',{maximumFractionDigits: Math.abs(n)<10? 1:0}).format(n); }

const CH = {
  histogram(values, colorVar){
    const W=640,H=340,M={t:18,r:18,b:42,l:56};
    const bins=8;
    const min=Math.min(...values), max=Math.max(...values);
    const bw=(max-min)/bins || 1;
    const counts=new Array(bins).fill(0);
    values.forEach(v=>{ let idx=Math.floor((v-min)/bw); if(idx>=bins) idx=bins-1; if(idx<0) idx=0; counts[idx]++; });
    const maxC=Math.max(...counts,1);
    const innerW=W-M.l-M.r, innerH=H-M.t-M.b;
    const slot=innerW/bins;
    const barW=slot-6;
    const yFor=c=> M.t+innerH-(c/maxC)*innerH;
    let bars='', labels='';
    counts.forEach((c,i)=>{
      const x=M.l+i*slot+3;
      const y=yFor(c);
      bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${(M.t+innerH)-y}" fill="${colorVar}" opacity="0.82" rx="2"/>`;
      labels+=`<text x="${x+barW/2}" y="${M.t+innerH+16}" font-size="12" text-anchor="middle" fill="var(--text-sec)">${fmt(min+i*bw)}</text>`;
    });
    let pts=counts.map((c,i)=> `${M.l+i*slot+3+barW/2},${yFor(c)}`).join(' ');
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">
      <line x1="${M.l}" y1="${M.t+innerH}" x2="${W-M.r}" y2="${M.t+innerH}" stroke="var(--border)"/>
      ${bars}
      <polyline points="${pts}" fill="none" stroke="var(--header)" stroke-width="1.8"/>
      ${labels}
    </svg>`;
  },

  lineChart(seriesArr, categories, pct){
    const W=680,H=340,M={t:20,r:18,b:44,l:62};
    const innerW=W-M.l-M.r, innerH=H-M.t-M.b;
    let allVals=[];
    seriesArr.forEach(s=> allVals=allVals.concat(s.values.filter(v=>v!==null&&!isNaN(v))));
    let min= pct?0:Math.min(0,...allVals), max = pct?100:Math.max(...allVals,1);
    if(max===min) max=min+1;
    const n=categories.length;
    const xFor=i=> M.l + (n<=1?0:(i/(n-1))*innerW);
    const yFor=v=> M.t + innerH - ((v-min)/(max-min))*innerH;
    let grid='', ticks=5;
    for(let t=0;t<=ticks;t++){
      const v=min+(max-min)*t/ticks;
      const y=yFor(v);
      grid+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="var(--border)" stroke-dasharray="2,3"/>
             <text x="${M.l-8}" y="${y+3}" font-size="12" text-anchor="end" fill="var(--text-sec)">${fmt(v)}${pct?'%':''}</text>`;
    }
    let xlabels=categories.map((c,i)=>`<text x="${xFor(i)}" y="${M.t+innerH+18}" font-size="12" text-anchor="middle" fill="var(--text-sec)">${c}</text>`).join('');
    let lines='';
    seriesArr.forEach(s=>{
      const pts = s.values.map((v,i)=> (v===null||isNaN(v))? null : `${xFor(i)},${yFor(v)}`).filter(Boolean).join(' ');
      lines+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2"/>`;
      s.values.forEach((v,i)=>{ if(v!==null && !isNaN(v)) lines+=`<circle cx="${xFor(i)}" cy="${yFor(v)}" r="2.6" fill="${s.color}"/>`; });
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">${grid}${lines}${xlabels}</svg>`;
  },

  // variante para el panel de outliers: colorea el punto marcado por IQR en vez de usar el color de la serie
  flaggedLine(values, categories, color){
    const flags = A.outliers(values);
    const W=680,H=340,M={t:20,r:18,b:44,l:62};
    const innerW=W-M.l-M.r, innerH=H-M.t-M.b;
    const min=Math.min(0,...values), max=Math.max(...values,1);
    const n=categories.length;
    const xFor=i=> M.l + (n<=1?0:(i/(n-1))*innerW);
    const yFor=v=> M.t + innerH - ((v-min)/((max-min)||1))*innerH;
    let grid='';
    for(let t=0;t<=4;t++){ const v=min+(max-min)*t/4; const y=yFor(v);
      grid+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="var(--border)" stroke-dasharray="2,3"/>
             <text x="${M.l-8}" y="${y+3}" font-size="12" text-anchor="end" fill="var(--text-sec)">${fmt(v)}</text>`; }
    let xlabels=categories.map((c,i)=>`<text x="${xFor(i)}" y="${M.t+innerH+18}" font-size="12" text-anchor="middle" fill="var(--text-sec)">${c}</text>`).join('');
    const pts=values.map((v,i)=>`${xFor(i)},${yFor(v)}`).join(' ');
    let dots='';
    values.forEach((v,i)=>{
      const f=flags[i];
      const c = f.flag ? (f.extreme?'var(--critico)':'var(--atencion)') : color;
      const r = f.flag ? 5.5 : 2.8;
      dots+=`<circle cx="${xFor(i)}" cy="${yFor(v)}" r="${r}" fill="${c}"/>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">
      ${grid}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>${dots}${xlabels}
    </svg>`;
  },

  scatter(x,y,xLabel,yLabel,color){
    const W=640,H=340,M={t:18,r:18,b:46,l:58};
    const innerW=W-M.l-M.r, innerH=H-M.t-M.b;
    const xmin=Math.min(...x), xmax=Math.max(...x);
    const ymin=Math.min(...y), ymax=Math.max(...y);
    const xr = xmax-xmin || 1, yr = ymax-ymin || 1;
    const xFor=v=> M.l + ((v-xmin)/xr)*innerW;
    const yFor=v=> M.t + innerH - ((v-ymin)/yr)*innerH;
    let pts=''; for(let i=0;i<x.length;i++){ pts+=`<circle cx="${xFor(x[i])}" cy="${yFor(y[i])}" r="4" fill="${color}" opacity="0.75"/>`; }
    const reg = A.regression(x,y);
    const x1=xmin, x2=xmax;
    const y1=reg.intercept+reg.slope*x1, y2=reg.intercept+reg.slope*x2;
    const trendLine = `<line x1="${xFor(x1)}" y1="${yFor(y1)}" x2="${xFor(x2)}" y2="${yFor(y2)}" stroke="var(--header)" stroke-width="1.6" stroke-dasharray="5,3"/>`;
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">
      <line x1="${M.l}" y1="${M.t+innerH}" x2="${W-M.r}" y2="${M.t+innerH}" stroke="var(--border)"/>
      <line x1="${M.l}" y1="${M.t}" x2="${M.l}" y2="${M.t+innerH}" stroke="var(--border)"/>
      <text x="${M.l+innerW/2}" y="${H-6}" font-size="12.5" text-anchor="middle" fill="var(--text-sec)">${xLabel}</text>
      <text x="12" y="${M.t+innerH/2}" font-size="12.5" text-anchor="middle" fill="var(--text-sec)" transform="rotate(-90 12 ${M.t+innerH/2})">${yLabel}</text>
      ${pts}${trendLine}
    </svg>`;
  },

  corrMatrix(vars, matrix){
    const cell=58, pad={t:74,l:122};
    const W=pad.l+cell*vars.length+10, H=pad.t+cell*vars.length+10;
    let cells='', colLabels='', rowLabels='';
    vars.forEach((v,ci)=>{
      colLabels+=`<text x="${pad.l+ci*cell+cell/2}" y="${pad.t-8}" font-size="12.5" text-anchor="start" fill="var(--text-sec)" transform="rotate(-38 ${pad.l+ci*cell+cell/2} ${pad.t-8})">${v.label}</text>`;
      rowLabels+=`<text x="${pad.l-8}" y="${pad.t+ci*cell+cell/2+4}" font-size="12.5" text-anchor="end" fill="var(--text-sec)">${v.label}</text>`;
    });
    vars.forEach((rv,ri)=>{
      vars.forEach((cv,ci)=>{
        const r = matrix[ri][ci];
        const isPos = r>=0;
        const inten = Math.min(Math.abs(r),1);
        const base = isPos ? '36,80,107' : '217,83,79';
        const bg = `rgba(${base},${(0.08+inten*0.75).toFixed(2)})`;
        const txtColor = inten>0.55 ? '#fff' : 'var(--text)';
        cells+=`<g>
          <rect x="${pad.l+ci*cell}" y="${pad.t+ri*cell}" width="${cell-2}" height="${cell-2}" fill="${bg}" rx="2"/>
          <text x="${pad.l+ci*cell+cell/2}" y="${pad.t+ri*cell+cell/2+4}" font-size="12.5" text-anchor="middle" fill="${txtColor}" font-family="var(--font-mono)">${r.toFixed(2)}</text>
        </g>`;
      });
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet" style="min-width:${W}px">${colLabels}${rowLabels}${cells}</svg>`;
  },

  boxplot(groups, color){
    const W=680,H=350,M={t:18,r:18,b:64,l:62};
    const innerW=W-M.l-M.r, innerH=H-M.t-M.b;
    let allVals=[]; groups.forEach(g=>allVals=allVals.concat(g.values));
    const min=Math.min(...allVals), max=Math.max(...allVals);
    const pad=(max-min)*0.08 || 1;
    const dmin= min>=0 ? Math.max(0,min-pad) : min-pad, dmax=max+pad;
    const yFor=v=> M.t + innerH - ((v-dmin)/(dmax-dmin))*innerH;
    const slot=innerW/groups.length;
    let content='', labels='';
    groups.forEach((g,i)=>{
      const q=A.quartiles(g.values);
      const cx=M.l+slot*i+slot/2;
      const boxW=Math.min(slot*0.42,60);
      const withinMax = Math.max(...g.values.filter(v=>v<=q.high));
      const withinMin = Math.min(...g.values.filter(v=>v>=q.low));
      content+=`<line x1="${cx}" y1="${yFor(withinMax)}" x2="${cx}" y2="${yFor(q.q3)}" stroke="var(--text-sec)"/>
        <line x1="${cx}" y1="${yFor(withinMin)}" x2="${cx}" y2="${yFor(q.q1)}" stroke="var(--text-sec)"/>
        <line x1="${cx-boxW/4}" y1="${yFor(withinMax)}" x2="${cx+boxW/4}" y2="${yFor(withinMax)}" stroke="var(--text-sec)"/>
        <line x1="${cx-boxW/4}" y1="${yFor(withinMin)}" x2="${cx+boxW/4}" y2="${yFor(withinMin)}" stroke="var(--text-sec)"/>
        <rect x="${cx-boxW/2}" y="${yFor(q.q3)}" width="${boxW}" height="${yFor(q.q1)-yFor(q.q3)}" fill="${color}" opacity="0.24" stroke="${color}"/>
        <line x1="${cx-boxW/2}" y1="${yFor(q.q2)}" x2="${cx+boxW/2}" y2="${yFor(q.q2)}" stroke="${color}" stroke-width="2.2"/>`;
      g.values.forEach(v=>{
        if(v<q.low||v>q.high){
          const extreme = v < q.low-1.5*q.iqr || v > q.high+1.5*q.iqr;
          content+=`<circle cx="${cx}" cy="${yFor(v)}" r="3.6" fill="${extreme?'var(--critico)':'var(--atencion)'}"/>`;
        }
      });
      labels+=`<text x="${cx}" y="${M.t+innerH+22}" font-size="12" text-anchor="end" fill="var(--text-sec)" transform="rotate(-38 ${cx} ${M.t+innerH+22})">${g.label}</text>`;
    });
    let grid=''; for(let t=0;t<=4;t++){ const v=dmin+(dmax-dmin)*t/4; const y=yFor(v);
      grid+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="var(--border)" stroke-dasharray="2,3"/><text x="${M.l-8}" y="${y+3}" font-size="12" text-anchor="end" fill="var(--text-sec)">${fmt(v)}</text>`; }
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">${grid}${content}${labels}</svg>`;
  }
};

/* =========================================================
   AGREGACIÓN mensual (para el panel de tendencia)
   ========================================================= */
function aggregateMonthly(varId){
  if(varId==='avance'){
    const weights={};
    RUBROS.forEach(r=>{ weights[r.id]=RAW[r.id].presupuesto.reduce((a,b)=>a+b,0); });
    const cumByRubro={};
    Object.keys(weights).forEach(rid=>{ let acc=0; cumByRubro[rid]=RAW[rid].avance.map(v=>acc+=v); });
    return MESES.map((m,idx)=>{
      let num=0, den=0;
      Object.keys(weights).forEach(rid=>{ num+=weights[rid]*cumByRubro[rid][idx]; den+=weights[rid]; });
      return den? num/den : 0;
    });
  }
  return MESES.map((m,idx)=>{
    let sum=0;
    RUBROS.forEach(r=>{ sum+=RAW[r.id][varId][idx]; });
    return sum;
  });
}
function cumulative(arr){ let acc=0; return arr.map(v=>acc+=v); }

/* =========================================================
   RENDER — panel fijo de una sola pantalla, sólo EDA
   ========================================================= */
function buildPanel1(){
  const vals = RECORDS.map(r=>getValue(r,'costo')).filter(v=>activeVal(v,'costo'));
  const mean=A.mean(vals), median=A.median(vals), std=A.std(vals);
  const asim = mean>median*1.3;
  return {
    badge:'01', color:'var(--eda)', title:'Distribución de Costo', type:'Histograma + curva de referencia',
    chart: CH.histogram(vals,'var(--costos)'),
    caption:`Media <b>${fmt(mean)}</b> · Mediana <b>${fmt(median)}</b> · Desvío <b>${fmt(std)}</b> miles $`,
    interp:[
      `La distribución tiene cola larga a la derecha: la mayoría de los registros mensuales están por debajo de ${fmt(median*1.5)} miles $, y unos pocos meses de Luminarias LED empujan la media muy por encima de la mediana.`,
      `Conviene revisar esos meses en el panel 04 antes de tomarlos como referencia para presupuestar el resto de la obra.`
    ]
  };
}
function buildPanel2(){
  const vars=['costo','avance'];
  const seriesArr = vars.map(vId=>{
    const vd=varDef(vId);
    let monthly = aggregateMonthly(vId);
    let vals = vId==='avance' ? monthly : cumulative(monthly);
    const last = vals[vals.length-1]||1;
    vals = vals.map(v=> last? v/last*100:0);
    return {name:vd.label,color:vd.color,values:vals};
  });
  const costoPct = seriesArr[0].values, avancePct = seriesArr[1].values;
  const brecha = Math.max(...costoPct.map((c,i)=>c-avancePct[i]));
  return {
    badge:'02', color:'var(--trend)', title:'Costo vs. Avance Físico', type:'Evolución acumulada (% del total)',
    chart: CH.lineChart(seriesArr, MESES.map(m=>m.label), true),
    caption:`<span style="color:var(--costos)">■</span> Costo &nbsp; <span style="color:var(--trend)">■</span> Avance &nbsp;·&nbsp; brecha máx. <b>${fmt(brecha)} p.p.</b>`,
    interp:[
      brecha>8
        ? `El costo acumulado avanza por encima del avance físico acumulado, con una brecha máxima de ${fmt(brecha)} puntos porcentuales durante el período.`
        : `El costo acumulado y el avance físico acumulado se mueven de forma relativamente pareja (brecha máxima ${fmt(brecha)} p.p.).`,
      `Si la brecha crece, conviene revisar productividad y precios en los rubros con mayor peso presupuestario (panel 06).`
    ]
  };
}
function buildPanel3(){
  const pairs = RECORDS.map(r=>({x:getValue(r,'avance'),y:getValue(r,'costo')})).filter(p=>!(p.x===0&&p.y===0));
  const x=pairs.map(p=>p.x), y=pairs.map(p=>p.y);
  const reg = A.regression(x,y);
  return {
    badge:'03', color:'var(--eda)', title:'Avance Físico vs. Costo', type:'Dispersión con línea de tendencia',
    chart: CH.scatter(x,y,'Avance físico (%)','Costo (miles $)','var(--eda)'),
    caption:`r = <b>${reg.r.toFixed(2)}</b> — ${A.corrStrengthLabel(reg.r)}`,
    interp:[
      `Se observa una relación ${reg.r>=0?'positiva':'negativa'} entre avance físico y costo (${A.corrStrengthLabel(reg.r)}); esto no implica causalidad.`,
      `El punto muy por encima de la recta corresponde a Luminarias LED — vale la pena confirmar si responde a un ajuste de precio puntual.`
    ]
  };
}
function buildPanel4(){
  const rubroId='cableado', varId='consumo';
  const vd=varDef(varId);
  const recs = RECORDS.filter(r=>r.rubro===rubroId);
  const withData = recs.map(r=>({v:getValue(r,varId),label:r.mesLabel})).filter(d=>d.v>0);
  const vals = withData.map(d=>d.v);
  const flags = A.outliers(vals);
  const flagIdx = flags.findIndex(f=>f.flag);
  const capt = flagIdx>=0
    ? `<b>${withData[flagIdx].label}</b>: ${fmt(vals[flagIdx])} m — valor atípico (IQR)`
    : 'Sin valores atípicos en el período';
  return {
    badge:'04', color:'var(--atencion)', title:'Consumo de Cable', type:'Serie mensual — detección por IQR',
    chart: CH.flaggedLine(vals, withData.map(d=>d.label), 'var(--eda)'),
    caption: capt,
    interp: flagIdx>=0 ? [
      `${withData[flagIdx].label} registra ${fmt(vals[flagIdx])} m de cable, muy por encima de los meses vecinos según el método IQR (rango intercuartílico).`,
      `Un valor atípico requiere análisis, no confirma un problema: puede deberse a recableado, pérdidas o un cambio de trazado puntual.`
    ] : [`No se detectaron valores atípicos en el período para esta combinación de rubro y variable.`]
  };
}
function buildPanel5(){
  const coreVars=['avance','costo','horas','consumo','erogaciones','certificacion'];
  const shortLabels=['Avance','Costo','Horas','Consumo','Erogac.','Certif.'];
  const vdFull = coreVars.map(id=>varDef(id));
  const vd = coreVars.map((id,i)=>({label:shortLabels[i]}));
  const series = coreVars.map(id=> RECORDS.map(r=>getValue(r,id)||0));
  const matrix = coreVars.map((_,i)=> coreVars.map((_,j)=> i===j?1:A.pearson(series[i],series[j])));
  let strongest={i:0,j:1,r:0}, weakest={i:0,j:1,r:1};
  for(let i=0;i<coreVars.length;i++) for(let j=i+1;j<coreVars.length;j++){
    if(Math.abs(matrix[i][j])>Math.abs(strongest.r)) strongest={i,j,r:matrix[i][j]};
    if(Math.abs(matrix[i][j])<Math.abs(weakest.r)) weakest={i,j,r:matrix[i][j]};
  }
  return {
    badge:'05', color:'var(--costos)', title:'Matriz de Correlación', type:'Avance · Costo · Horas · Consumo · Erogaciones · Certificación',
    chart: CH.corrMatrix(vd, matrix),
    caption:`Más fuerte: <b>${vdFull[strongest.i].label}</b> ↔ <b>${vdFull[strongest.j].label}</b> (r=${strongest.r.toFixed(2)})`,
    interp:[
      `${vdFull[strongest.i].label} y ${vdFull[strongest.j].label} son las variables que más se mueven juntas del período (r=${strongest.r.toFixed(2)}).`,
      `${vdFull[weakest.i].label} y ${vdFull[weakest.j].label} muestran la relación más débil (r=${weakest.r.toFixed(2)}) — la correlación no implica causalidad en ningún caso.`
    ]
  };
}
const RUBRO_LABEL_CORTO = {
  excavacion:'Excavación', hormigon:'Hormigón', canalizaciones:'Canaliz.', columnas:'Columnas',
  cableado:'Cableado', tableros:'Tableros', luminarias:'Luminarias', manoobra:'M. de Obra',
  equipos:'Equipos', senalizacion:'Señaliz.'
};
function buildPanel6(){
  const vId='costo';
  const groups = RUBROS.map(r=>{
    const vals = RECORDS.filter(rec=>rec.rubro===r.id).map(rec=>getValue(rec,vId)).filter(v=>v>0);
    return {label:RUBRO_LABEL_CORTO[r.id], full:r.nombre, values: vals.length?vals:[0]};
  });
  let top={label:'',med:-Infinity}, disp={label:'',iqr:-Infinity};
  groups.forEach(g=>{
    const m=A.median(g.values); if(m>top.med) top={label:g.full,med:m};
    const q=A.quartiles(g.values); if(q.iqr>disp.iqr) disp={label:g.full,iqr:q.iqr};
  });
  return {
    badge:'06', color:'var(--productividad)', title:'Costo por Rubro', type:'Diagrama de caja (boxplot)',
    chart: CH.boxplot(groups, 'var(--productividad)'),
    caption:`Mayor mediana: <b>${top.label}</b>`,
    interp:[
      `${top.label} concentra la mediana de costo más alta entre los rubros comparados.`,
      `${disp.label} presenta la caja más alta (mayor dispersión mensual), lo que indica menor previsibilidad de costo mes a mes.`
    ]
  };
}

function panelHtml(p){
  const vb = p.chart.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
  const ratio = vb ? `${vb[1]}/${vb[2]}` : '2/1';
  const interpHtml = (p.interp||[]).map((line,i)=>
    `<div class="iline"><b class="itag">${i===0?'¿Qué se observa?':'¿Qué investigar?'}</b> ${line}</div>`
  ).join('');
  return `<div class="card">
    <div class="chead">
      <div class="badge" style="background:${p.color}">${p.badge}</div>
      <div class="ctitle"><h3>${p.title}</h3><div class="ctype">${p.type}</div></div>
    </div>
    <div class="chart-wrap" style="aspect-ratio:${ratio}">${p.chart}</div>
    <div class="caption">${p.caption}</div>
    <div class="mini-interp">${interpHtml}</div>
  </div>`;
}

function render(){
  const panels=[buildPanel1(),buildPanel2(),buildPanel3(),buildPanel4(),buildPanel5(),buildPanel6()];
  document.getElementById('app').innerHTML = `
    <div class="top">
      <div>
        <h1>Análisis <span>Exploratorio de Datos</span> (EDA)</h1>
        <div class="sub">Exploración del comportamiento económico y operativo de la obra</div>
      </div>
      <div class="obra"><b>Alumbrado Público RP16</b>Ene — Jul 2026<br>10 rubros · 70 registros</div>
    </div>
    <div class="grid">${panels.map(panelHtml).join('')}</div>
  `;
}
render();
</script>
